name: Helm warm runner canary
on:
  push:
    branches: [ci/helm-warm-runner]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: helm-warm-runner-canary
  cancel-in-progress: false
jobs:
  browser:
    if: github.ref == 'refs/heads/ci/helm-warm-runner'
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        sample: [cold, warm-1, warm-2, warm-3, warm-4, warm-5]
    runs-on:
      group: helm-runners
      labels: homelab-heavy
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepared-runner
      - uses: ./.github/actions/browser-validation
        with:
          evidence-name: helm-local-${{ matrix.sample }}-${{ github.run_id }}
  hosted-browser:
    # Matched-commit benchmark exception: this job measures the retained hosted
    # environment. It has no deployment or registry publication credentials.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ hashFiles('web/package-lock.json') }}
      - name: Install hosted browser dependencies
        run: |
          started=$SECONDS
          cd web
          npm ci
          npx playwright install --with-deps chromium
          printf 'HELM_PREPARE_SECONDS=%s\n' "$((SECONDS-started))" >> "$GITHUB_ENV"
      - uses: ./.github/actions/browser-validation
        with:
          evidence-name: helm-hosted-${{ github.run_id }}
