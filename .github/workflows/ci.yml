name: Helm CI and deploy

on:
  pull_request:
  push:
    branches: [main, beta]
  workflow_dispatch:

permissions:
  contents: read

# Checks are scoped to their workflow/ref so unrelated pull requests cannot
# block production. Production mutation jobs below use their own fixed,
# non-canceling lock.
concurrency:
  group: helm-${{ github.workflow }}-${{ github.ref }}
  # Pull-request checks may be superseded, but no main or beta workflow may be
  # canceled while it is carrying an environment deployment.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/beta' }}

# VM128 admits only reviewed beta/main and explicit canary workflow refs.
# Public PRs and protected deploy jobs retain their hosted compatibility path:
# ordinary test pods cannot access deployment services. Enable trusted browser
# routing only after the single-VM canary and admission gates are accepted.
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Frontend checks and build
        working-directory: web
        run: |
          npm ci
          npm audit --audit-level=high
          npm run openapi:check
          npm run check
          npm run build
      - name: Embed frontend and run Go checks
        run: |
          rm -rf -- internal/webassets/dist internal/frontend/dist
          install -d internal/webassets/dist internal/frontend/dist dist
          cp -a web/dist/. internal/webassets/dist/
          cp -a web/dist/. internal/frontend/dist/
          test -z "$(gofmt -l cmd internal)"
          # @version selects immutable tool modules; Go's public checksum
          # database verifies their content without adding tools to the app
          # module or production image.
          GOSUMDB=sum.golang.org go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.10
          go vet ./...
          GOSUMDB=sum.golang.org go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
          python3 -m py_compile deploy/coolify-deploy.py
          bash -n deploy/*.sh deploy/helm-deploy-gateway
          ./deploy/test-deployment-security.sh
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o dist/helm ./cmd/helm
          docker compose config >/dev/null
      - name: Upload immutable binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: helm-binary-${{ github.sha }}
          path: dist/helm
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 3 || 14 }}

  browser:
    runs-on: ${{ fromJSON(github.event_name != 'pull_request' && (github.ref == 'refs/heads/beta' || github.ref == 'refs/heads/main') && vars.HELM_WARM_RUNNER_ENABLED == 'true' && '{"group":"helm-runners","labels":"homelab-heavy"}' || '"ubuntu-24.04"') }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepared-runner
        if: runner.environment == 'self-hosted'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: runner.environment != 'self-hosted'
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: runner.environment != 'self-hosted'
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Cache matching Playwright Chromium downloads
        if: runner.environment != 'self-hosted'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ hashFiles('web/package-lock.json') }}
      - name: Install hosted browser dependencies
        if: runner.environment != 'self-hosted'
        run: |
          cd web
          npm ci
          npx playwright install --with-deps chromium
      - uses: ./.github/actions/browser-validation
        with:
          evidence-name: helm-e2e-${{ github.sha }}

  # Keep the protected-main race context tied to the real race-instrumented
  # browser and stalled-account workflows above.
  race:
    if: ${{ always() }}
    needs: browser
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Require successful race-instrumented workflows
        env:
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: test "$BROWSER_RESULT" = success

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: checks
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build immutable production image
        run: |
          image_dir="$RUNNER_TEMP/helm-container"
          install -d -m 0700 "$image_dir"
          docker build --pull --label org.opencontainers.image.source=https://github.com/KanterLabs/helm --tag "helm:${GITHUB_SHA}" .
          docker image inspect "helm:${GITHUB_SHA}" >/dev/null
          container_id=$(docker run --detach "helm:${GITHUB_SHA}")
          cleanup() { docker rm --force "$container_id" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          ready=false
          for _ in $(seq 1 30); do
            if docker exec "$container_id" /usr/local/bin/helm healthcheck >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            docker logs "$container_id"
            exit 1
          fi
          docker exec "$container_id" /usr/local/bin/helm healthcheck
          docker cp "$container_id:/usr/local/bin/codex" "$image_dir/codex"
          test -x "$image_dir/codex"
          (cd "$image_dir" && sha256sum codex > codex.sha256)
          docker exec "$container_id" /usr/local/bin/cloudflared --version
          docker exec "$container_id" /usr/local/bin/cloudflared tunnel --help >/dev/null
          docker cp "$container_id:/usr/local/bin/cloudflared" "$image_dir/cloudflared"
          test -x "$image_dir/cloudflared"
          (cd "$image_dir" && sha256sum cloudflared > cloudflared.sha256)
          printf 'container_smoke=ok\n'
          image_tar="$image_dir/helm-${GITHUB_SHA}.tar"
          docker save --output "$image_tar" "helm:${GITHUB_SHA}"
          docker run --rm \
            --volume "$image_dir:/scan:ro" \
            aquasec/trivy:0.67.2@sha256:e2b22eac59c02003d8749f5b8d9bd073b62e30fefaef5b7c8371204e0a4b0c08 \
            image --input "/scan/helm-${GITHUB_SHA}.tar" \
            --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress
          gzip -n "$image_tar"
          image_archive=${image_tar##*/}.gz
          (cd "$image_dir" && sha256sum "$image_archive" > "$image_archive.sha256")
      - name: Publish the tested image by immutable registry digest
        id: publish
        if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/beta' || github.ref == 'refs/heads/main') }}
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          image=ghcr.io/kanterlabs/helm
          docker_config=$(mktemp -d "$RUNNER_TEMP/helm-ghcr.XXXXXX")
          cleanup_registry() { rm -rf -- "$docker_config"; }
          trap cleanup_registry EXIT
          export DOCKER_CONFIG="$docker_config"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker tag "helm:${GITHUB_SHA}" "$image:${GITHUB_SHA}"
          docker push "$image:${GITHUB_SHA}"
          digest=$(docker image inspect "$image:${GITHUB_SHA}" --format '{{range .RepoDigests}}{{println .}}{{end}}' | sed -n 's|^ghcr.io/kanterlabs/helm@||p')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'image=%s@%s\n' "$image" "$digest" >> "$GITHUB_OUTPUT"
      - name: Upload immutable image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: helm-image-${{ github.sha }}
          path: |
            ${{ runner.temp }}/helm-container/helm-${{ github.sha }}.tar.gz
            ${{ runner.temp }}/helm-container/helm-${{ github.sha }}.tar.gz.sha256
            ${{ runner.temp }}/helm-container/codex
            ${{ runner.temp }}/helm-container/codex.sha256
            ${{ runner.temp }}/helm-container/cloudflared
            ${{ runner.temp }}/helm-container/cloudflared.sha256
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 3 || 14 }}

  beta_deploy:
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/beta' && vars.HELM_BETA_DEPLOY_PAUSED != 'true' }}
    needs: [checks, browser, race, container]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: beta
      url: https://beta-helm.home.shanekanterman.dev
    concurrency:
      group: helm-beta
      cancel-in-progress: false
    env:
      COOLIFY_API_URL: ${{ vars.COOLIFY_API_URL }}
      COOLIFY_PROJECT_UUID: ${{ vars.COOLIFY_PROJECT_UUID }}
      COOLIFY_ENVIRONMENT_UUID: ${{ vars.COOLIFY_ENVIRONMENT_UUID }}
      COOLIFY_SERVICE_UUID: ${{ vars.COOLIFY_SERVICE_UUID }}
      COOLIFY_SERVICE_NAME: ${{ vars.COOLIFY_SERVICE_NAME }}
      COOLIFY_SERVER_UUID: ${{ vars.COOLIFY_SERVER_UUID }}
      HELM_SITE_URL: ${{ vars.HELM_SITE_URL }}
      HELM_IMAGE: ${{ needs.container.outputs.image }}
      HELM_RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require the validated release to remain the branch tip
        id: tip
        env:
          READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_REF: refs/heads/beta
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REF" = "$EXPECTED_REF" ]]
          authorization=$(printf 'x-access-token:%s' "$READ_TOKEN" | base64 -w0)
          tip=$(git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $authorization" ls-remote --exit-code --refs origin "$EXPECTED_REF" | awk -v ref="$EXPECTED_REF" '$2 == ref { print $1 }')
          [[ "$tip" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$tip" != "$GITHUB_SHA" ]]; then
            printf 'The branch advanced; this validated release will not overwrite its successor.\n'
            printf 'current=false\n' >> "$GITHUB_OUTPUT"
          else
            printf 'current=true\n' >> "$GITHUB_OUTPUT"
          fi
      - name: Connect protected deployment to the private tailnet
        if: ${{ steps.tip.outputs.current == 'true' }}
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:gha-helm-deploy
          # The action already passes --accept-routes; do not repeat it in args.
      - name: Deploy exact Coolify service and verify private readiness
        if: ${{ steps.tip.outputs.current == 'true' }}
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          HELM_DEPLOY_EVIDENCE: ${{ runner.temp }}/helm-coolify-beta/deployment.json
        run: python3 deploy/coolify-deploy.py
      - name: Upload sanitized deployment and rollback evidence
        if: ${{ always() && steps.tip.outputs.current == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: helm-coolify-beta-${{ github.sha }}
          path: ${{ runner.temp }}/helm-coolify-beta/deployment.json
          if-no-files-found: warn
          retention-days: 14

  deploy:
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.HELM_PRODUCTION_DEPLOY_PAUSED != 'true' }}
    needs: [checks, browser, race, container]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
      url: https://helm.home.shanekanterman.dev
    concurrency:
      group: helm-production
      cancel-in-progress: false
    env:
      COOLIFY_API_URL: ${{ vars.COOLIFY_API_URL }}
      COOLIFY_PROJECT_UUID: ${{ vars.COOLIFY_PROJECT_UUID }}
      COOLIFY_ENVIRONMENT_UUID: ${{ vars.COOLIFY_ENVIRONMENT_UUID }}
      COOLIFY_SERVICE_UUID: ${{ vars.COOLIFY_SERVICE_UUID }}
      COOLIFY_SERVICE_NAME: ${{ vars.COOLIFY_SERVICE_NAME }}
      COOLIFY_SERVER_UUID: ${{ vars.COOLIFY_SERVER_UUID }}
      HELM_SITE_URL: ${{ vars.HELM_SITE_URL }}
      HELM_IMAGE: ${{ needs.container.outputs.image }}
      HELM_RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require the validated release to remain the branch tip
        id: tip
        env:
          READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_REF: refs/heads/main
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REF" = "$EXPECTED_REF" ]]
          authorization=$(printf 'x-access-token:%s' "$READ_TOKEN" | base64 -w0)
          tip=$(git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $authorization" ls-remote --exit-code --refs origin "$EXPECTED_REF" | awk -v ref="$EXPECTED_REF" '$2 == ref { print $1 }')
          [[ "$tip" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$tip" != "$GITHUB_SHA" ]]; then
            printf 'The branch advanced; this validated release will not overwrite its successor.\n'
            printf 'current=false\n' >> "$GITHUB_OUTPUT"
          else
            printf 'current=true\n' >> "$GITHUB_OUTPUT"
          fi
      - name: Connect protected deployment to the private tailnet
        if: ${{ steps.tip.outputs.current == 'true' }}
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:gha-helm-deploy
          # The action already passes --accept-routes; do not repeat it in args.
      - name: Deploy exact Coolify service and verify private readiness
        if: ${{ steps.tip.outputs.current == 'true' }}
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          HELM_DEPLOY_EVIDENCE: ${{ runner.temp }}/helm-coolify-production/deployment.json
        run: python3 deploy/coolify-deploy.py
      - name: Upload sanitized deployment and rollback evidence
        if: ${{ always() && steps.tip.outputs.current == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: helm-coolify-production-${{ github.sha }}
          path: ${{ runner.temp }}/helm-coolify-production/deployment.json
          if-no-files-found: warn
          retention-days: 14
