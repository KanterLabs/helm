name: Helm CI and deploy

on:
  pull_request:
    branches: [main, beta]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited]
  push:
    branches: [main, beta]
  workflow_dispatch:
    inputs:
      scope:
        description: Validation only; never publishes or deploys.
        type: choice
        options: [full, fast, focused]
        default: full

permissions:
  contents: read

concurrency:
  group: helm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/beta' }}

# Compatibility exception: the single VM currently admits only the reviewed
# trusted browser/canary path. PR and control jobs retain the hosted boundary;
# adding a plan must not silently widen that infrastructure admission policy.
# Shadow is the default until required-check migration has been accepted.
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      proposed_scope: ${{ steps.plan.outputs.proposed_scope }}
      effective_scope: ${{ steps.plan.outputs.effective_scope }}
      browser: ${{ steps.plan.outputs.browser }}
      race: ${{ steps.plan.outputs.race }}
      container: ${{ steps.plan.outputs.container }}
      publish: ${{ steps.plan.outputs.publish }}
      deploy: ${{ steps.plan.outputs.deploy }}
      image: ${{ steps.promotion.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          node-version: 22.23.2
      - name: Resolve a trusted same-source promotion candidate
        id: promotion
        env:
          GH_TOKEN: ${{ github.token }}
          CI_PLAN_MODE: ${{ vars.HELM_CI_PLAN_MODE || 'shadow' }}
        run: python3 test/ci/promotion-candidate.py --root . --output promotion.json --mode "$CI_PLAN_MODE" --github-output "$GITHUB_OUTPUT"
      - name: Capture the event validation plan
        id: plan
        env:
          CI_PLAN_MODE: ${{ vars.HELM_CI_PLAN_MODE || 'shadow' }}
        run: |
          args=(--event "$GITHUB_EVENT_PATH" --event-name "$GITHUB_EVENT_NAME" --repository . --output ci-plan.json --github-output "$GITHUB_OUTPUT" --mode "$CI_PLAN_MODE")
          if python3 -c 'import json; raise SystemExit(json.load(open("promotion.json")).get("accepted") is not True)'; then
            args+=(--promotion promotion.json)
          fi
          python3 test/ci/plan.py "${args[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: helm-ci-plan-${{ github.sha }}-${{ github.run_attempt }}
          path: ci-plan.json
          if-no-files-found: error
          retention-days: 14

  checks:
    if: ${{ always() }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Keep the historical checks gate red if planning failed
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
        run: test "$PLAN_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-checks
        with:
          scope: ${{ needs.plan.outputs.effective_scope }}

  browser:
    if: needs.plan.outputs.browser == 'true'
    needs: plan
    runs-on: ${{ fromJSON(github.event_name != 'pull_request' && (github.ref == 'refs/heads/beta' || github.ref == 'refs/heads/main') && vars.HELM_WARM_RUNNER_ENABLED == 'true' && '{"group":"helm-runners","labels":"homelab-heavy"}' || '"ubuntu-24.04"') }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: helm-ci-plan-${{ github.sha }}-${{ github.run_attempt }}
      - uses: ./.github/actions/prepared-runner
        if: runner.environment == 'self-hosted'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: runner.environment != 'self-hosted'
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: runner.environment != 'self-hosted'
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Cache matching Playwright Chromium downloads
        if: runner.environment != 'self-hosted'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ hashFiles('web/package-lock.json') }}
      - name: Install hosted browser dependencies
        if: runner.environment != 'self-hosted'
        run: |
          cd web
          npm ci
          npx playwright install --with-deps chromium
      - uses: ./.github/actions/browser-validation
        with:
          evidence-name: helm-e2e-${{ github.sha }}
          plan: ci-plan.json

  race:
    if: ${{ always() && (needs.plan.result != 'success' || needs.plan.outputs.race == 'true') }}
    needs: [plan, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require successful race-instrumented workflows
        env:
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: test "$BROWSER_RESULT" = success

  container:
    if: needs.plan.outputs.container == 'true'
    needs: [plan, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-container
        env:
          PROMOTION_IMAGE: ${{ needs.plan.outputs.image }}

  pr-gate:
    if: ${{ always() }}
    needs: [plan, checks, browser, race, container]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require a captured plan
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
        run: test "$PLAN_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-gate
        with:
          browser: ${{ needs.plan.outputs.browser }}
          scope: ${{ needs.plan.outputs.effective_scope }}
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          GH_TOKEN: ${{ github.token }}

  publish:
    if: ${{ always() && github.event_name == 'push' && (github.ref == 'refs/heads/beta' || github.ref == 'refs/heads/main') && needs.plan.result == 'success' && needs.plan.outputs.publish == 'true' && needs.checks.result == 'success' && needs.container.result == 'success' && needs.pr-gate.result == 'success' && ((needs.browser.result == 'success' && needs.race.result == 'success') || (needs.plan.outputs.effective_scope == 'promotion' && needs.browser.result == 'skipped' && needs.race.result == 'skipped')) }}
    needs: [plan, checks, browser, race, container, pr-gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: publish
        uses: ./.github/actions/ci-publish
        env:
          GHCR_TOKEN: ${{ github.token }}
          PROMOTION_IMAGE: ${{ needs.plan.outputs.image }}

  validation_receipt:
    if: ${{ always() && github.event_name == 'push' && needs.publish.result == 'success' && needs.pr-gate.result == 'success' }}
    needs: [plan, checks, browser, race, container, pr-gate, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-receipt
        with:
          image: ${{ needs.publish.outputs.image }}
          scope: ${{ needs.plan.outputs.effective_scope }}

  beta_deploy:
    if: ${{ always() && github.event_name == 'push' && needs.plan.outputs.deploy == 'true' && needs.publish.result == 'success' && needs.validation_receipt.result == 'success' && needs.pr-gate.result == 'success' && github.ref == 'refs/heads/beta' && vars.HELM_BETA_DEPLOY_PAUSED != 'true' }}
    needs: [plan, checks, browser, race, container, pr-gate, publish, validation_receipt]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: beta
      url: https://beta-helm.home.shanekanterman.dev
    concurrency:
      group: helm-beta
      cancel-in-progress: false
    env:
      COOLIFY_API_URL: ${{ vars.COOLIFY_API_URL }}
      COOLIFY_PROJECT_UUID: ${{ vars.COOLIFY_PROJECT_UUID }}
      COOLIFY_ENVIRONMENT_UUID: ${{ vars.COOLIFY_ENVIRONMENT_UUID }}
      COOLIFY_SERVICE_UUID: ${{ vars.COOLIFY_SERVICE_UUID }}
      COOLIFY_SERVICE_NAME: ${{ vars.COOLIFY_SERVICE_NAME }}
      COOLIFY_SERVER_UUID: ${{ vars.COOLIFY_SERVER_UUID }}
      HELM_SITE_URL: ${{ vars.HELM_SITE_URL }}
      HELM_IMAGE: ${{ needs.publish.outputs.image }}
      HELM_RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require the validated release to remain the branch tip
        id: tip
        env:
          READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_REF: refs/heads/beta
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REF" = "$EXPECTED_REF" ]]
          authorization=$(printf 'x-access-token:%s' "$READ_TOKEN" | base64 -w0)
          tip=$(git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $authorization" ls-remote --exit-code --refs origin "$EXPECTED_REF" | awk -v ref="$EXPECTED_REF" '$2 == ref { print $1 }')
          [[ "$tip" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$tip" != "$GITHUB_SHA" ]]; then
            printf 'The branch advanced; this validated release will not overwrite its successor.\n'
            printf 'current=false\n' >> "$GITHUB_OUTPUT"
          else
            printf 'current=true\n' >> "$GITHUB_OUTPUT"
          fi
      - name: Connect protected deployment to the private tailnet
        if: ${{ steps.tip.outputs.current == 'true' }}
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:gha-helm-deploy
          # The action already passes --accept-routes; do not repeat it in args.
      - name: Deploy exact Coolify service and verify private readiness
        if: ${{ steps.tip.outputs.current == 'true' }}
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          HELM_DEPLOY_EVIDENCE: ${{ runner.temp }}/helm-coolify-beta/deployment.json
        run: python3 deploy/coolify-deploy.py
      - name: Upload sanitized deployment and rollback evidence
        if: ${{ always() && steps.tip.outputs.current == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: helm-coolify-beta-${{ github.sha }}
          path: ${{ runner.temp }}/helm-coolify-beta/deployment.json
          if-no-files-found: warn
          retention-days: 14

  deploy:
    if: ${{ always() && github.event_name == 'push' && needs.plan.outputs.deploy == 'true' && needs.publish.result == 'success' && needs.validation_receipt.result == 'success' && needs.pr-gate.result == 'success' && github.ref == 'refs/heads/main' && vars.HELM_PRODUCTION_DEPLOY_PAUSED != 'true' }}
    needs: [plan, checks, browser, race, container, pr-gate, publish, validation_receipt]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
      url: https://helm.home.shanekanterman.dev
    concurrency:
      group: helm-production
      cancel-in-progress: false
    env:
      COOLIFY_API_URL: ${{ vars.COOLIFY_API_URL }}
      COOLIFY_PROJECT_UUID: ${{ vars.COOLIFY_PROJECT_UUID }}
      COOLIFY_ENVIRONMENT_UUID: ${{ vars.COOLIFY_ENVIRONMENT_UUID }}
      COOLIFY_SERVICE_UUID: ${{ vars.COOLIFY_SERVICE_UUID }}
      COOLIFY_SERVICE_NAME: ${{ vars.COOLIFY_SERVICE_NAME }}
      COOLIFY_SERVER_UUID: ${{ vars.COOLIFY_SERVER_UUID }}
      HELM_SITE_URL: ${{ vars.HELM_SITE_URL }}
      HELM_IMAGE: ${{ needs.publish.outputs.image }}
      HELM_RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require the validated release to remain the branch tip
        id: tip
        env:
          READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_REF: refs/heads/main
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REF" = "$EXPECTED_REF" ]]
          authorization=$(printf 'x-access-token:%s' "$READ_TOKEN" | base64 -w0)
          tip=$(git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $authorization" ls-remote --exit-code --refs origin "$EXPECTED_REF" | awk -v ref="$EXPECTED_REF" '$2 == ref { print $1 }')
          [[ "$tip" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$tip" != "$GITHUB_SHA" ]]; then
            printf 'The branch advanced; this validated release will not overwrite its successor.\n'
            printf 'current=false\n' >> "$GITHUB_OUTPUT"
          else
            printf 'current=true\n' >> "$GITHUB_OUTPUT"
          fi
      - name: Connect protected deployment to the private tailnet
        if: ${{ steps.tip.outputs.current == 'true' }}
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:gha-helm-deploy
          # The action already passes --accept-routes; do not repeat it in args.
      - name: Deploy exact Coolify service and verify private readiness
        if: ${{ steps.tip.outputs.current == 'true' }}
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          HELM_DEPLOY_EVIDENCE: ${{ runner.temp }}/helm-coolify-production/deployment.json
        run: python3 deploy/coolify-deploy.py
      - name: Upload sanitized deployment and rollback evidence
        if: ${{ always() && steps.tip.outputs.current == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: helm-coolify-production-${{ github.sha }}
          path: ${{ runner.temp }}/helm-coolify-production/deployment.json
          if-no-files-found: warn
          retention-days: 14
