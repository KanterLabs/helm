name: Inspect beta hostname recovery
on:
  pull_request:
    branches: [beta]
    paths:
      - .github/workflows/beta-host-recovery.yml
      - deploy/beta-host-recovery.py
permissions:
  contents: read
jobs:
  inspect:
    if: github.head_ref == 'fix/beta-hostname-isolation' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: homelab
    environment: beta
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Inspect exact beta routing and TLS metadata
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.BETA_CLOUDFLARE_API_TOKEN }}
        run: python3 deploy/beta-host-recovery.py
