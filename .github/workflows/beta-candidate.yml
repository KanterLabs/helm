name: Helm beta candidate admission

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-character lowercase SHA at the tip of the candidate branch
        required: true
        type: string
      candidate_ref:
        description: Canonical candidate branch ref (refs/heads/feature/name); not main or beta
        required: true
        type: string

permissions:
  contents: read

# A candidate run may wait for the regular beta deployment, but two candidate
# runs must never race the beta switch state or its rollback decision.
concurrency:
  group: helm-beta-candidate
  cancel-in-progress: false

jobs:
  admit:
    # The workflow file and this job's checkout are trusted only when the
    # operator dispatches the protected canonical beta ref. A fork can neither
    # provide the workflow definition nor reach the beta environment job.
    if: ${{ github.repository == 'KanterLabs/helm' && github.event.repository.full_name == 'KanterLabs/helm' && github.ref == 'refs/heads/beta' }}
    runs-on: homelab
    outputs:
      candidate_sha: ${{ steps.validate.outputs.candidate_sha }}
      candidate_ref: ${{ steps.validate.outputs.candidate_ref }}
      trusted_sha: ${{ steps.validate.outputs.trusted_sha }}
      metadata_name: ${{ steps.validate.outputs.metadata_name }}
    steps:
      # The canonical KanterLabs/infrastructure homelab runner contract gives
      # each job one ephemeral runner pod and private DinD daemon; no host
      # Docker socket/home/static deployment credential is mounted, and the
      # workspace and daemon disappear when the job ends. Keep this checkout
      # explicit anyway so the source boundary is independently auditable.
      # This is the only source checkout in the admission job. The candidate
      # is fetched as an object after validation; it is never used as the
      # workflow or deployment-script source here.
      - name: Check out the trusted beta workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate candidate identity and schema boundary
        id: validate
        env:
          CANDIDATE_SHA_INPUT: ${{ inputs.candidate_sha }}
          CANDIDATE_REF_INPUT: ${{ inputs.candidate_ref }}
          EVENT_REPOSITORY: ${{ github.event.repository.full_name }}
          CANONICAL_REPOSITORY: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          fail() { printf 'candidate admission: %s\n' "$*" >&2; exit 1; }

          [[ "$GITHUB_REPOSITORY" = KanterLabs/helm ]] || fail 'workflow is not running in the canonical repository'
          [[ "$EVENT_REPOSITORY" = KanterLabs/helm ]] || fail 'fork dispatches are not accepted'
          [[ "$CANONICAL_REPOSITORY" = KanterLabs/helm ]] || fail 'unexpected canonical repository'
          [[ "$GITHUB_REF" = refs/heads/beta ]] || fail 'dispatch must run from refs/heads/beta'
          [[ "$GITHUB_WORKFLOW_REF" = 'KanterLabs/helm/.github/workflows/beta-candidate.yml@refs/heads/beta' ]] || fail 'workflow definition is not the protected canonical beta candidate workflow'
          [[ "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA" ]] || fail 'workflow definition SHA does not equal the protected beta event SHA'
          [[ "$RUNNER_TEMP" = /* ]] || fail 'runner temp directory is not an absolute per-job path'
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]] || fail 'trusted checkout is not clean at admission start'
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || fail 'trusted beta event SHA is not a full lowercase SHA'
          [[ "$CANDIDATE_SHA_INPUT" =~ ^[0-9a-f]{40}$ ]] || fail 'candidate_sha must be exactly 40 lowercase hexadecimal characters'
          [[ "$CANDIDATE_REF_INPUT" != *$'\n'* && "$CANDIDATE_REF_INPUT" != *$'\r'* ]] || fail 'candidate_ref contains a control character'
          [[ "$CANDIDATE_REF_INPUT" =~ ^refs/heads/[A-Za-z0-9][A-Za-z0-9._/-]*$ ]] || fail 'candidate_ref must use safe canonical refs/heads syntax'

          candidate_branch=${CANDIDATE_REF_INPUT#refs/heads/}
          [[ "$candidate_branch" != main && "$candidate_branch" != beta ]] || fail 'main and beta are not candidate branches'
          [[ "$candidate_branch" != *'..'* && "$candidate_branch" != *'//'* && "$candidate_branch" != *'/.'* && "$candidate_branch" != *'./'* && "$candidate_branch" != *'@{'* ]] || fail 'candidate_ref contains a forbidden ref component'
          [[ "$candidate_branch" != */ && "$candidate_branch" != *. ]] || fail 'candidate_ref must not end with a slash or dot'
          git check-ref-format --branch "$candidate_branch" >/dev/null || fail 'candidate_ref is not a valid Git branch ref'

          origin_url=$(git config --get remote.origin.url || true)
          case "$origin_url" in
            https://github.com/KanterLabs/helm|https://github.com/KanterLabs/helm.git|git@github.com:KanterLabs/helm|git@github.com:KanterLabs/helm.git) ;;
            *) fail 'checkout origin is not the canonical repository (fork rejected)' ;;
          esac

          # Resolve the branch tip through the canonical origin and require the
          # operator-provided SHA to be that same object. This rejects stale
          # inputs and a branch that moved while admission was starting.
          candidate_ref_sha=$(git ls-remote --exit-code --refs origin "$CANDIDATE_REF_INPUT" | awk -v ref="$CANDIDATE_REF_INPUT" '$2 == ref { print $1 }') || fail 'candidate_ref does not resolve in the canonical repository'
          [[ "$candidate_ref_sha" = "$CANDIDATE_SHA_INPUT" ]] || fail 'candidate_sha is not the current canonical candidate_ref tip'
          git fetch --no-tags --prune origin "$CANDIDATE_REF_INPUT"
          fetched_sha=$(git rev-parse 'FETCH_HEAD^{commit}')
          [[ "$fetched_sha" = "$CANDIDATE_SHA_INPUT" ]] || fail 'candidate ref changed while it was being fetched'
          git cat-file -e "${CANDIDATE_SHA_INPUT}^{commit}" || fail 'candidate SHA is not a commit in the canonical repository'
          [[ "$(git rev-parse "${CANDIDATE_SHA_INPUT}^{commit}")" = "$CANDIDATE_SHA_INPUT" ]] || fail 'candidate SHA did not resolve to itself'
          if [[ "$(git rev-parse --is-shallow-repository)" = true ]]; then
            git fetch --no-tags --prune --unshallow origin
          fi
          [[ "$(git rev-parse --is-shallow-repository)" = false ]] || fail 'full Git history is required before the candidate ancestry check'
          git merge-base --is-ancestor "$GITHUB_SHA" "$CANDIDATE_SHA_INPUT" || fail 'candidate must be based on the trusted beta commit; rebase it onto beta and retry'

          beta_ref_sha=$(git ls-remote --exit-code --refs origin refs/heads/beta | awk '$2 == "refs/heads/beta" { print $1 }') || fail 'trusted beta ref could not be resolved'
          [[ "$beta_ref_sha" = "$GITHUB_SHA" ]] || fail 'workflow event is not the current protected beta ref'

          # Schema compatibility is intentionally source-level and fail-closed:
          # a candidate may change application behavior, but it cannot change
          # the embedded SQL tree, migration engine, or Go module inputs used
          # by beta.
          git diff --quiet "$GITHUB_SHA" "$CANDIDATE_SHA_INPUT" -- internal/db/migrations || fail 'candidate migrations differ from trusted beta'
          git diff --quiet "$GITHUB_SHA" "$CANDIDATE_SHA_INPUT" -- internal/db/db.go || fail 'candidate migration engine differs from trusted beta'
          git diff --quiet "$GITHUB_SHA" "$CANDIDATE_SHA_INPUT" -- go.mod || fail 'candidate go.mod differs from trusted beta'
          git diff --quiet "$GITHUB_SHA" "$CANDIDATE_SHA_INPUT" -- go.sum || fail 'candidate go.sum differs from trusted beta'

          tree_digest() {
            local revision=$1
            {
              printf 'internal/db/migrations\n'
              git ls-tree -r --full-tree "$revision" -- internal/db/migrations
              printf 'internal/db/db.go\n'
              git ls-tree "$revision" -- internal/db/db.go
              printf 'go.mod\n'
              git ls-tree "$revision" -- go.mod
              printf 'go.sum\n'
              git ls-tree "$revision" -- go.sum
            } | sha256sum | awk '{ print $1 }'
          }
          trusted_schema_digest=$(tree_digest "$GITHUB_SHA")
          candidate_schema_digest=$(tree_digest "$CANDIDATE_SHA_INPUT")
          [[ "$trusted_schema_digest" = "$candidate_schema_digest" ]] || fail 'candidate schema provenance digest differs from trusted beta'

          # Commit subjects are untrusted display text even though the commit
          # identity is canonical. Normalize them in this non-secret admission
          # job, then carry the exact bounded value in the provenance artifact.
          candidate_subject=$(
            python3 - "$CANDIDATE_SHA_INPUT" <<'PY'
          import subprocess
          import sys
          import unicodedata

          raw = subprocess.check_output(
              ["git", "show", "-s", "--format=%s", sys.argv[1]],
              stderr=subprocess.DEVNULL,
          )
          text = raw.decode("utf-8", "strict")
          output = []
          pending_space = False
          for char in text:
              if char.isspace() or unicodedata.category(char).startswith("C"):
                  pending_space = True
                  continue
              if pending_space and output:
                  output.append(" ")
              output.append(char)
              pending_space = False
          normalized = "".join(output)
          bounded = ""
          for char in normalized:
              if len((bounded + char).encode("utf-8")) > 160:
                  break
              bounded += char
          if not bounded:
              raise SystemExit("candidate commit subject is empty after normalization")
          sys.stdout.write(bounded)
          PY
          ) || fail 'candidate commit subject could not be normalized'
          [[ -n "$candidate_subject" ]] || fail 'candidate commit subject is empty'
          [[ "$(LC_ALL=C printf '%s' "$candidate_subject" | wc -c)" -le 160 ]] || fail 'candidate commit subject exceeds its byte bound'

          metadata_name="helm-beta-candidate-metadata-$CANDIDATE_SHA_INPUT"
          metadata="$RUNNER_TEMP/candidate.metadata"
          umask 077
          {
            printf 'metadata_version=helm-beta-candidate-v2\n'
            printf 'candidate_repository=%s\n' "$CANONICAL_REPOSITORY"
            printf 'candidate_sha=%s\n' "$CANDIDATE_SHA_INPUT"
            printf 'candidate_ref=%s\n' "$CANDIDATE_REF_INPUT"
            printf 'candidate_subject=%s\n' "$candidate_subject"
            printf 'trusted_repository=%s\n' "$CANONICAL_REPOSITORY"
            printf 'trusted_ref=refs/heads/beta\n'
            printf 'trusted_sha=%s\n' "$GITHUB_SHA"
            printf 'trusted_workflow_ref=%s\n' "$GITHUB_WORKFLOW_REF"
            printf 'trusted_workflow_sha=%s\n' "$GITHUB_WORKFLOW_SHA"
            printf 'migration_tree=internal/db/migrations\n'
            printf 'migration_engine=internal/db/db.go\n'
            printf 'module_files=go.mod,go.sum\n'
            printf 'schema_digest=%s\n' "$candidate_schema_digest"
            printf 'schema_gate=identical-to-trusted-beta\n'
          } > "$metadata"
          chmod 0644 "$metadata"
          {
            printf 'candidate_sha=%s\n' "$CANDIDATE_SHA_INPUT"
            printf 'candidate_ref=%s\n' "$CANDIDATE_REF_INPUT"
            printf 'trusted_sha=%s\n' "$GITHUB_SHA"
            printf 'metadata_name=%s\n' "$metadata_name"
          } >> "$GITHUB_OUTPUT"
      - name: Publish trusted candidate provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.validate.outputs.metadata_name }}
          path: ${{ runner.temp }}/candidate.metadata
          if-no-files-found: error
          retention-days: 14

  checks:
    if: ${{ github.repository == 'KanterLabs/helm' && github.event.repository.full_name == 'KanterLabs/helm' && github.ref == 'refs/heads/beta' }}
    needs: admit
    runs-on: homelab
    steps:
      - name: Check out the exact candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.admit.outputs.candidate_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify immutable candidate checkout
        env:
          EXPECTED_SHA: ${{ needs.admit.outputs.candidate_sha }}
        run: |
          set -Eeuo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" = "$EXPECTED_SHA" ]]
      - name: Download trusted candidate metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: helm-beta-candidate-metadata-${{ needs.admit.outputs.candidate_sha }}
          path: ${{ runner.temp }}/candidate-metadata
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Frontend checks and build
        working-directory: web
        run: |
          npm ci
          npm audit --audit-level=high
          npm run openapi:check
          npm run check
          npm test
          npm run build
      - name: Embed frontend and run Go checks
        run: |
          set -Eeuo pipefail
          rm -rf -- internal/webassets/dist internal/frontend/dist
          install -d internal/webassets/dist internal/frontend/dist dist
          cp -a web/dist/. internal/webassets/dist/
          cp -a web/dist/. internal/frontend/dist/
          test -z "$(gofmt -l cmd internal)"
          GOSUMDB=sum.golang.org go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.10
          go test ./...
          go vet ./...
          GOSUMDB=sum.golang.org go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
          bash -n deploy/*.sh deploy/helm-deploy-gateway
          ./deploy/test-deployment-security.sh
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o dist/helm ./cmd/helm
          (cd dist && sha256sum helm > helm.sha256)
          install -m 0644 "$RUNNER_TEMP/candidate-metadata/candidate.metadata" dist/candidate.metadata
          docker compose config >/dev/null
      - name: Upload candidate binary and provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: helm-beta-candidate-binary-${{ needs.admit.outputs.candidate_sha }}
          path: |
            dist/helm
            dist/helm.sha256
            dist/candidate.metadata
          if-no-files-found: error
          retention-days: 14

  browser:
    if: ${{ github.repository == 'KanterLabs/helm' && github.event.repository.full_name == 'KanterLabs/helm' && github.ref == 'refs/heads/beta' }}
    needs: admit
    runs-on: homelab-heavy
    steps:
      - name: Check out the exact candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.admit.outputs.candidate_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify immutable candidate checkout
        env:
          EXPECTED_SHA: ${{ needs.admit.outputs.candidate_sha }}
        run: |
          set -Eeuo pipefail
          [[ "$(git rev-parse HEAD)" = "$EXPECTED_SHA" ]]
      - name: Download trusted candidate metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: helm-beta-candidate-metadata-${{ needs.admit.outputs.candidate_sha }}
          path: ${{ runner.temp }}/candidate-metadata
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install browser dependencies and build the candidate app
        run: |
          set -Eeuo pipefail
          cd web
          npm ci
          npx playwright install chromium
          npm run build
          cd ..
          rm -rf -- internal/webassets/dist
          install -d internal/webassets/dist
          cp -a web/dist/. internal/webassets/dist/
          CGO_ENABLED=0 go build -trimpath -o /tmp/helm-beta-candidate-e2e ./cmd/helm
      - name: Run the real candidate browser workflow
        env:
          HELM_E2E_BASE_URL: http://127.0.0.1:18080
        run: |
          set -Eeuo pipefail
          test -f "$RUNNER_TEMP/candidate-metadata/candidate.metadata"
          test_dir=$(mktemp -d)
          cleanup() {
            if [[ -n "${server_pid:-}" ]]; then
              kill "$server_pid" >/dev/null 2>&1 || true
              wait "$server_pid" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT
          HELM_ADDR=127.0.0.1:18080 \
            HELM_DB="$test_dir/roadmap.db" \
            HELM_AUTH_MODE=disabled \
            HELM_PUBLIC_ORIGIN=http://127.0.0.1:18080 \
            HELM_SECURE_COOKIES=false \
            HELM_DEMO_SEED=false \
            /tmp/helm-beta-candidate-e2e >"$test_dir/server.log" 2>&1 &
          server_pid=$!
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/readyz >/dev/null; then
              break
            fi
            if [[ "$attempt" -eq 30 ]]; then
              cat "$test_dir/server.log"
              exit 1
            fi
            sleep 1
          done
          cd web
          npm run e2e
          cd ..
          kill "$server_pid"
          wait "$server_pid" || true
          server_pid=
          HELM_ADDR=127.0.0.1:18081 \
            HELM_DB="$test_dir/local-roadmap.db" \
            HELM_AUTH_MODE=local \
            HELM_PUBLIC_ORIGIN=http://127.0.0.1:18081 \
            HELM_SECURE_COOKIES=false \
            HELM_DEMO_SEED=false \
            /tmp/helm-beta-candidate-e2e >"$test_dir/local-server.log" 2>&1 &
          server_pid=$!
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18081/readyz >/dev/null; then
              break
            fi
            if [[ "$attempt" -eq 30 ]]; then
              cat "$test_dir/local-server.log"
              exit 1
            fi
            sleep 1
          done
          cd web
          HELM_E2E_BASE_URL=http://127.0.0.1:18081 npx playwright test e2e/onboarding.spec.ts
      - name: Upload candidate browser diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: helm-beta-candidate-browser-${{ needs.admit.outputs.candidate_sha }}
          path: |
            web/playwright-report
            web/test-results
            ${{ runner.temp }}/candidate-metadata/candidate.metadata
          if-no-files-found: ignore
          retention-days: 7

  race:
    if: ${{ github.repository == 'KanterLabs/helm' && github.event.repository.full_name == 'KanterLabs/helm' && github.ref == 'refs/heads/beta' }}
    needs: admit
    runs-on: homelab-heavy
    steps:
      - name: Check out the exact candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.admit.outputs.candidate_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify immutable candidate checkout
        env:
          EXPECTED_SHA: ${{ needs.admit.outputs.candidate_sha }}
        run: |
          set -Eeuo pipefail
          [[ "$(git rev-parse HEAD)" = "$EXPECTED_SHA" ]]
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run candidate Go race detector
        run: go test -race ./...

  container:
    if: ${{ github.repository == 'KanterLabs/helm' && github.event.repository.full_name == 'KanterLabs/helm' && github.ref == 'refs/heads/beta' }}
    needs: [admit, checks]
    runs-on: homelab-heavy
    steps:
      - name: Check out the exact candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.admit.outputs.candidate_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify immutable candidate checkout
        env:
          EXPECTED_SHA: ${{ needs.admit.outputs.candidate_sha }}
        run: |
          set -Eeuo pipefail
          [[ "$(git rev-parse HEAD)" = "$EXPECTED_SHA" ]]
      - name: Download trusted candidate metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: helm-beta-candidate-metadata-${{ needs.admit.outputs.candidate_sha }}
          path: ${{ runner.temp }}/candidate-metadata
      - name: Build and smoke-test immutable candidate image
        env:
          CANDIDATE_SHA: ${{ needs.admit.outputs.candidate_sha }}
        run: |
          set -Eeuo pipefail
          image_dir="$RUNNER_TEMP/helm-beta-candidate-container"
          install -d -m 0700 "$image_dir"
          docker build --pull --tag "helm:candidate-$CANDIDATE_SHA" .
          docker image inspect "helm:candidate-$CANDIDATE_SHA" >/dev/null
          container_id=$(docker run --detach "helm:candidate-$CANDIDATE_SHA")
          cleanup() { docker rm --force "$container_id" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          ready=false
          for _ in $(seq 1 30); do
            if docker exec "$container_id" /usr/local/bin/helm healthcheck >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            docker logs "$container_id"
            exit 1
          fi
          docker exec "$container_id" /usr/local/bin/helm healthcheck
          docker cp "$container_id:/usr/local/bin/codex" "$image_dir/codex"
          test -x "$image_dir/codex"
          (cd "$image_dir" && sha256sum codex > codex.sha256)
          image_tar="$image_dir/helm-$CANDIDATE_SHA.tar"
          docker save --output "$image_tar" "helm:candidate-$CANDIDATE_SHA"
          docker run --rm \
            --volume "$image_dir:/scan:ro" \
            aquasec/trivy:0.67.2@sha256:e2b22eac59c02003d8749f5b8d9bd073b62e30fefaef5b7c8371204e0a4b0c08 \
            image --input "/scan/helm-$CANDIDATE_SHA.tar" \
            --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress
          gzip -n "$image_tar"
          image_archive=${image_tar##*/}.gz
          (cd "$image_dir" && sha256sum "$image_archive" > "$image_archive.sha256")
          install -m 0644 "$RUNNER_TEMP/candidate-metadata/candidate.metadata" "$image_dir/candidate.metadata"
      - name: Upload candidate image and runtime artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: helm-beta-candidate-image-${{ needs.admit.outputs.candidate_sha }}
          path: |
            ${{ runner.temp }}/helm-beta-candidate-container/helm-${{ needs.admit.outputs.candidate_sha }}.tar.gz
            ${{ runner.temp }}/helm-beta-candidate-container/helm-${{ needs.admit.outputs.candidate_sha }}.tar.gz.sha256
            ${{ runner.temp }}/helm-beta-candidate-container/codex
            ${{ runner.temp }}/helm-beta-candidate-container/codex.sha256
            ${{ runner.temp }}/helm-beta-candidate-container/candidate.metadata
          if-no-files-found: error
          retention-days: 14

  candidate_deploy:
    # This is the only secret-bearing job. It checks out the exact beta event
    # SHA and never checks out candidate_ref or candidate_sha as source.
    if: ${{ github.repository == 'KanterLabs/helm' && github.event.repository.full_name == 'KanterLabs/helm' && github.ref == 'refs/heads/beta' && vars.HELM_BETA_DEPLOY_PAUSED != 'true' }}
    needs: [admit, checks, browser, race, container]
    runs-on: homelab
    environment:
      name: beta
      url: https://beta-helm.home.shanekanterman.dev
    concurrency:
      group: helm-beta
      cancel-in-progress: false
    env:
      HELM_DEPLOY_ENVIRONMENT: beta
      HELM_PUBLIC_ORIGIN: https://beta-helm.home.shanekanterman.dev
      CANDIDATE_SHA: ${{ needs.admit.outputs.candidate_sha }}
      CANDIDATE_REF: ${{ needs.admit.outputs.candidate_ref }}
      TRUSTED_BETA_SHA: ${{ needs.admit.outputs.trusted_sha }}
      HELM_BETA_SWITCH_SOCKET: /run/helm-beta-switcher/helm-beta-switchd.sock
    steps:
      - name: Check out only the trusted beta event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify trusted beta source and provenance
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REPOSITORY" = KanterLabs/helm ]]
          [[ "$GITHUB_REF" = refs/heads/beta ]]
          [[ "$GITHUB_WORKFLOW_REF" = 'KanterLabs/helm/.github/workflows/beta-candidate.yml@refs/heads/beta' ]]
          [[ "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA" ]]
          [[ "$GITHUB_SHA" = "$TRUSTED_BETA_SHA" ]]
          [[ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]]
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]]
      - name: Download candidate provenance
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: helm-beta-candidate-metadata-${{ needs.admit.outputs.candidate_sha }}
          path: ${{ runner.temp }}/candidate-metadata
      - name: Download tested candidate binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: helm-beta-candidate-binary-${{ needs.admit.outputs.candidate_sha }}
          path: ${{ runner.temp }}/candidate-binary
      - name: Download tested candidate container artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: helm-beta-candidate-image-${{ needs.admit.outputs.candidate_sha }}
          path: ${{ runner.temp }}/candidate-image
      - name: Verify candidate metadata, artifacts, and checksums
        run: |
          set -Eeuo pipefail
          fail() { printf 'candidate deploy verification: %s\n' "$*" >&2; exit 1; }
          metadata="$RUNNER_TEMP/candidate-metadata/candidate.metadata"
          binary_metadata="$RUNNER_TEMP/candidate-binary/candidate.metadata"
          image_metadata="$RUNNER_TEMP/candidate-image/candidate.metadata"
          for file in "$metadata" "$binary_metadata" "$image_metadata"; do
            [[ -f "$file" && ! -L "$file" ]] || fail "missing provenance metadata: $file"
          done
          metadata_value() {
            local key=$1 path=$2
            awk -F= -v key="$key" '$1 == key { count++; value = substr($0, index($0, "=") + 1) } END { if (count != 1) exit 1; print value }' "$path"
          }
          [[ "$(metadata_value metadata_version "$metadata")" = helm-beta-candidate-v2 ]] || fail 'unexpected metadata version'
          [[ "$(metadata_value candidate_repository "$metadata")" = KanterLabs/helm ]] || fail 'candidate repository is not canonical'
          [[ "$(metadata_value candidate_sha "$metadata")" = "$CANDIDATE_SHA" ]] || fail 'candidate SHA metadata mismatch'
          [[ "$(metadata_value candidate_ref "$metadata")" = "$CANDIDATE_REF" ]] || fail 'candidate ref metadata mismatch'
          candidate_subject=$(metadata_value candidate_subject "$metadata") || fail 'candidate subject metadata is missing'
          python3 - "$candidate_subject" <<'PY' || fail 'candidate subject metadata is not canonical'
          import sys
          import unicodedata

          value = sys.argv[1]
          if not value or len(value.encode("utf-8")) > 160 or value.strip() != value:
              raise SystemExit(1)
          if any(char != " " and (char.isspace() or unicodedata.category(char).startswith("C")) for char in value):
              raise SystemExit(1)
          PY
          [[ "$(metadata_value trusted_repository "$metadata")" = KanterLabs/helm ]] || fail 'trusted repository metadata mismatch'
          [[ "$(metadata_value trusted_ref "$metadata")" = refs/heads/beta ]] || fail 'trusted ref metadata mismatch'
          [[ "$(metadata_value trusted_sha "$metadata")" = "$TRUSTED_BETA_SHA" ]] || fail 'trusted SHA metadata mismatch'
          [[ "$(metadata_value trusted_workflow_ref "$metadata")" = 'KanterLabs/helm/.github/workflows/beta-candidate.yml@refs/heads/beta' ]] || fail 'trusted workflow ref metadata mismatch'
          [[ "$(metadata_value trusted_workflow_sha "$metadata")" = "$GITHUB_WORKFLOW_SHA" ]] || fail 'trusted workflow SHA metadata mismatch'
          [[ "$(metadata_value migration_tree "$metadata")" = internal/db/migrations ]] || fail 'migration tree metadata mismatch'
          [[ "$(metadata_value migration_engine "$metadata")" = internal/db/db.go ]] || fail 'migration engine metadata mismatch'
          [[ "$(metadata_value module_files "$metadata")" = go.mod,go.sum ]] || fail 'Go module boundary metadata mismatch'
          [[ "$(metadata_value schema_gate "$metadata")" = identical-to-trusted-beta ]] || fail 'schema gate metadata mismatch'
          cmp -s "$metadata" "$binary_metadata" || fail 'binary artifact provenance does not match trusted metadata'
          cmp -s "$metadata" "$image_metadata" || fail 'container artifact provenance does not match trusted metadata'
          printf '%s\n' "$candidate_subject" > "$RUNNER_TEMP/candidate-subject"
          chmod 0600 "$RUNNER_TEMP/candidate-subject"
          (cd "$RUNNER_TEMP/candidate-binary" && sha256sum --check --strict helm.sha256) || fail 'candidate binary checksum failed'
          (cd "$RUNNER_TEMP/candidate-image" && sha256sum --check --strict codex.sha256) || fail 'tested Codex checksum failed'
          (cd "$RUNNER_TEMP/candidate-image" && sha256sum --check --strict "helm-$CANDIDATE_SHA.tar.gz.sha256") || fail 'tested candidate image checksum failed'
          install -d -m 0755 dist dist/container
          install -m 0755 "$RUNNER_TEMP/candidate-binary/helm" dist/helm
          install -m 0755 "$RUNNER_TEMP/candidate-image/codex" dist/codex
          test -x dist/helm
          test -x dist/codex
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build helm-beta-switchd from trusted beta source
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REF" = refs/heads/beta ]]
          [[ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]]
          test -d cmd/helm-beta-switchd
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o dist/helm-beta-switchd ./cmd/helm-beta-switchd
          test -x dist/helm-beta-switchd
          sha256sum dist/helm-beta-switchd > dist/helm-beta-switchd.sha256
      - name: Configure beta deploy identity
        env:
          DEPLOY_KEY: ${{ secrets.BETA_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.BETA_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$DEPLOY_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          [[ "$RUNNER_TEMP" = /* ]]
          ssh_dir="$RUNNER_TEMP/helm-ssh"
          install -d -m 0700 "$ssh_dir"
          printf '%s\n' "$DEPLOY_KEY" > "$ssh_dir/helm-deploy"
          chmod 0600 "$ssh_dir/helm-deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 0600 "$ssh_dir/known_hosts"
          printf '%s\n' \
            'Host 10.0.0.20' \
            "  IdentityFile $ssh_dir/helm-deploy" \
            "  UserKnownHostsFile $ssh_dir/known_hosts" \
            '  IdentitiesOnly yes' \
            '  BatchMode yes' \
            '  StrictHostKeyChecking yes' \
            > "$ssh_dir/config"
          chmod 0600 "$ssh_dir/config"
          printf 'HELM_SSH_CONFIG=%s\n' "$ssh_dir/config" >> "$GITHUB_ENV"
      - name: Capture previous beta release for recovery
        id: previous_release
        run: |
          set -Eeuo pipefail
          status_output=$(./deploy/deploy-ci.sh status)
          previous_sha=$(sed -n 's/^current_sha=//p' <<<"$status_output")
          [[ "$previous_sha" = none || "$previous_sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'sha=%s\n' "$previous_sha" >> "$GITHUB_OUTPUT"
      - name: Prepare private beta owner environment for candidate switch
        env:
          HELM_ADMIN_EMAIL: ${{ secrets.BETA_ADMIN_EMAIL }}
        run: |
          set -Eeuo pipefail
          test -n "$HELM_ADMIN_EMAIL"
          [[ "$HELM_ADMIN_EMAIL" != *$'\n'* && "$HELM_ADMIN_EMAIL" != *$'\r'* ]]
          [[ "$CANDIDATE_REF" =~ ^refs/heads/[A-Za-z0-9][A-Za-z0-9._/-]*$ ]]
          chmod 0755 deploy/*.sh deploy/helm-deploy-gateway
          private_dir="$RUNNER_TEMP/helm-private"
          install -d -m 0700 "$private_dir"
          owner_file="$private_dir/owner.env"
          {
            printf 'HELM_ADDR=127.0.0.1:8080\n'
            printf 'HELM_DB=/var/lib/roadmap/data/roadmap.db\n'
            printf 'HELM_LUNA_ENABLED=true\nHELM_LUNA_MODEL=gpt-5.6-luna\nHELM_LUNA_EFFORT=medium\n'
            printf 'HELM_AUTH_MODE=tailnet\n'
            printf 'HELM_PUBLIC_ORIGIN=https://beta-helm.home.shanekanterman.dev\n'
            printf 'HELM_ADMIN_EMAIL=%s\n' "$HELM_ADMIN_EMAIL"
            printf 'HELM_TAILNET_OWNER_LOGIN=ShaneKanterman04@github\n'
            printf 'HELM_TAILNET_AUDIENCE=https://beta-helm.home.shanekanterman.dev\n'
            printf 'HELM_TAILNET_ASSERTION_KEY_FILE=/etc/roadmap/tailnet.key\n'
            printf 'HELM_TAILNET_TLS_ADDR=10.0.0.39:8443\n'
            printf 'HELM_TAILNET_TLS_CERT_FILE=/etc/roadmap/tailnet-origin.crt\n'
            printf 'HELM_TAILNET_TLS_KEY_FILE=/etc/roadmap/tailnet-origin.key\n'
            printf 'HELM_TAILNET_ALLOWED_PEER_IPS=10.0.0.101\n'
            printf 'HELM_SECURE_COOKIES=true\nHELM_DEMO_SEED=false\n'
            printf 'HELM_RELEASE_REF=%s\n' "$CANDIDATE_REF"
            printf 'HELM_BETA_SWITCH_ENABLED=true\n'
            printf 'HELM_BETA_SWITCH_SOCKET=%s\n' "$HELM_BETA_SWITCH_SOCKET"
            printf 'ROADMAP_ADDR=127.0.0.1:8080\nROADMAP_DB=/var/lib/roadmap/data/roadmap.db\n'
            printf 'ROADMAP_AUTH_MODE=tailnet\nROADMAP_PUBLIC_ORIGIN=https://beta-helm.home.shanekanterman.dev\n'
            printf 'ROADMAP_ADMIN_EMAIL=%s\n' "$HELM_ADMIN_EMAIL"
            printf 'ROADMAP_TAILNET_OWNER_LOGIN=ShaneKanterman04@github\n'
            printf 'ROADMAP_TAILNET_AUDIENCE=https://beta-helm.home.shanekanterman.dev\n'
            printf 'ROADMAP_TAILNET_ASSERTION_KEY_FILE=/etc/roadmap/tailnet.key\n'
            printf 'ROADMAP_TAILNET_TLS_ADDR=10.0.0.39:8443\n'
            printf 'ROADMAP_TAILNET_TLS_CERT_FILE=/etc/roadmap/tailnet-origin.crt\n'
            printf 'ROADMAP_TAILNET_TLS_KEY_FILE=/etc/roadmap/tailnet-origin.key\n'
            printf 'ROADMAP_TAILNET_ALLOWED_PEER_IPS=10.0.0.101\n'
            printf 'ROADMAP_SECURE_COOKIES=true\nROADMAP_DEMO_SEED=false\n'
            printf 'ROADMAP_RELEASE_REF=%s\n' "$CANDIDATE_REF"
            printf 'ROADMAP_BETA_SWITCH_ENABLED=true\n'
            printf 'ROADMAP_BETA_SWITCH_SOCKET=%s\n' "$HELM_BETA_SWITCH_SOCKET"
          } > "$owner_file"
          chmod 0600 "$owner_file"
          printf 'HELM_OWNER_ENV_FILE=%s\n' "$owner_file" >> "$GITHUB_ENV"
      - name: Materialize beta release signing key
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.BETA_RELEASE_SIGNING_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$RELEASE_SIGNING_KEY"
          install -d -m 0700 "$RUNNER_TEMP/helm-signing"
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$RUNNER_TEMP/helm-signing/private.pem"
          chmod 0600 "$RUNNER_TEMP/helm-signing/private.pem"
      - name: Deploy the exact candidate through trusted deploy-ci.sh
        env:
          HELM_RELEASE_SIGNING_KEY_FILE: ${{ runner.temp }}/helm-signing/private.pem
          HELM_RELEASE_REF: ${{ needs.admit.outputs.candidate_ref }}
          HELM_BETA_SWITCH_ENABLED: 'true'
          HELM_BETA_SWITCH_SOCKET: /run/helm-beta-switcher/helm-beta-switchd.sock
          HELM_BETA_SWITCHD_BINARY: ${{ github.workspace }}/dist/helm-beta-switchd
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REF" = refs/heads/beta ]]
          [[ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]]
          candidate_subject=$(<"$RUNNER_TEMP/candidate-subject")
          [[ -n "$candidate_subject" ]]
          HELM_RELEASE_SUBJECT="$candidate_subject" ./deploy/deploy-ci.sh deploy "$CANDIDATE_SHA"
      - name: Validate private beta candidate readiness
        env:
          PREVIOUS_RELEASE_SHA: ${{ steps.previous_release.outputs.sha }}
        run: |
          set -Eeuo pipefail
          if ./deploy/deploy-ci.sh private-ready; then
            exit 0
          fi
          printf 'post-deploy private beta candidate readiness failed; attempting automatic rollback\n' >&2
          if [[ "$PREVIOUS_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            if ! ./deploy/deploy-ci.sh rollback "$PREVIOUS_RELEASE_SHA"; then
              printf 'automatic beta rollback to %s failed\n' "$PREVIOUS_RELEASE_SHA" >&2
            else
              printf 'automatic beta rollback to %s completed; validation remains failed\n' "$PREVIOUS_RELEASE_SHA" >&2
            fi
          else
            printf 'no previous retained beta release is available; automatic rollback skipped\n' >&2
          fi
          exit 1
      - name: Remove beta candidate deployment credentials
        if: ${{ always() }}
        run: |
          rm -f -- "$RUNNER_TEMP/helm-signing/private.pem"
          rm -rf -- "$RUNNER_TEMP/helm-ssh" "$RUNNER_TEMP/helm-private"
          rm -f -- "$RUNNER_TEMP/candidate-subject"
          rm -f -- dist/owner.env
