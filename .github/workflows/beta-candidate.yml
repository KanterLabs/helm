name: Helm beta candidate admission (retired LXC controller)

on:
  workflow_dispatch:

permissions:
  contents: read

# Retain hosted-cutover 92615c2: ci-runner-partition-arc-cap forces retired
# homelab-heavy pools to 0/0; restoring ARC is a separate platform migration.
jobs:
  retired:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Explain retired candidate admission
        run: |
          printf '%s\n' 'Candidate admission is disabled: its LXC switch controller cannot mutate the Coolify beta service.'
          printf '%s\n' 'Merge validated changes to beta; Helm CI deploys the immutable image to the protected Coolify beta target.'
          exit 1
