name: Helm trusted validation receipt
description: Bind successful full validation or explicit promotion to immutable artifacts.
inputs:
  image:
    description: Published immutable image digest.
    required: true
  scope:
    description: Full validation or trusted promotion acceptance.
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache: true
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22.23.2
    - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
      with:
        name: helm-ci-gate-${{ github.sha }}-${{ github.run_attempt }}
    - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
      if: inputs.scope == 'full'
      with:
        name: helm-binary-${{ github.sha }}
        path: dist
    - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
      if: inputs.scope == 'full'
      with:
        name: helm-frontend-${{ github.sha }}
        path: web/dist
    - name: Create exact-source trusted receipt
      shell: bash
      env:
        RECEIPT_SCOPE: ${{ inputs.scope }}
        RECEIPT_IMAGE: ${{ inputs.image }}
      run: |
        python3 test/ci/receipt-job.py --root . --validation verified-gate.json --image "$RECEIPT_IMAGE" --scope "$RECEIPT_SCOPE" --output receipt/validation.json
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: helm-validation-${{ github.sha }}-${{ github.run_attempt }}
        path: receipt/validation.json
        if-no-files-found: error
        retention-days: 14
