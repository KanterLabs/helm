#!/usr/sbin/nft -f

flush ruleset

table inet roadmap_filter {
  chain input {
    type filter hook input priority 0; policy drop;

    iifname "lo" accept
    # Private installers replace this marker with exact, reviewed LAN
    # source-IP rules for tcp/8443 on CT 103 or CT 106. The public profile
    # leaves it inert; guests need no tailscale interface for edge ingress.
    # HELM_BETA_TAILNET_RULES
    ct state invalid drop
    ct state established,related accept
    # ICMP is useful for diagnostics but no TCP service is exposed by the
    # guest.  The app and cloudflared both use loopback only.
    ip protocol icmp accept
    ip6 nexthdr icmpv6 accept
  }

  chain forward {
    type filter hook forward priority 0; policy drop;
  }

  chain output {
    type filter hook output priority 0; policy accept;
  }
}
