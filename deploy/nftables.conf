#!/usr/sbin/nft -f

flush ruleset

table inet roadmap_filter {
  chain input {
    type filter hook input priority 0; policy drop;

    iifname "lo" accept
    # The beta private installer replaces this marker with exact, reviewed
    # LAN source-IP rules for tcp/8443. Production leaves it inert; CT 106
    # does not require a tailscale interface for the homelab-edge origin.
    # HELM_BETA_TAILNET_RULES
    ct state invalid drop
    ct state established,related accept
    # ICMP is useful for diagnostics but no TCP service is exposed by the
    # guest.  The app and cloudflared both use loopback only.
    ip protocol icmp accept
    ip6 nexthdr icmpv6 accept
  }

  chain forward {
    type filter hook forward priority 0; policy drop;
  }

  chain output {
    type filter hook output priority 0; policy accept;
  }
}
