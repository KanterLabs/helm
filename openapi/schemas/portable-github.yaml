components:
  schemas:
    PortableGithubArtifact:
      type: object
      required:
        - id
        - project_id
        - repository
        - number
        - url
        - created_at
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        project_id:
          $ref: "#/components/schemas/Identifier"
        repository:
          type: string
        repository_id:
          type: integer
          minimum: 1
        number:
          type: integer
          minimum: 1
        url:
          type: string
          format: uri
        created_at:
          $ref: "#/components/schemas/Timestamp"
      additionalProperties: false
    PortableTaskArtifact:
      type: object
      required:
        - task_id
        - artifact_id
        - created_at
      properties:
        task_id:
          $ref: "#/components/schemas/Identifier"
        artifact_id:
          $ref: "#/components/schemas/Identifier"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        created_by:
          $ref: "#/components/schemas/Identifier"
      additionalProperties: false
    PortableAuditRun:
      type: object
      required:
        - id
        - project_id
        - actor_id
        - scope
        - status
        - started_at
        - created_at
        - updated_at
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        project_id:
          $ref: "#/components/schemas/Identifier"
        actor_id:
          $ref: "#/components/schemas/Identifier"
        scope:
          type: string
        status:
          $ref: "#/components/schemas/AuditRunStatus"
        started_at:
          $ref: "#/components/schemas/Timestamp"
        finalized_at:
          $ref: "#/components/schemas/Timestamp"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
      additionalProperties: false
    PortableAuditFinding:
      type: object
      required:
        - id
        - audit_id
        - task_id
        - captured_version
        - source_column
        - verdict
        - confidence
        - reason
        - evidence_refs
        - review_state
        - version
        - created_at
        - updated_at
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        audit_id:
          $ref: "#/components/schemas/Identifier"
        task_id:
          $ref: "#/components/schemas/Identifier"
        captured_version:
          type: integer
          minimum: 1
        source_column:
          $ref: "#/components/schemas/Identifier"
        verdict:
          $ref: "#/components/schemas/AuditVerdict"
        proposed_semantic_destination:
          type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1
        reason:
          type: string
        evidence_refs:
          type: array
          items:
            type: string
        review_state:
          $ref: "#/components/schemas/AuditReviewState"
        version:
          type: integer
          minimum: 1
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
      additionalProperties: false
    PortableGithubArchive:
      type: object
      description: Portable v3 durable GitHub links and audit history. Excludes credentials, repository
        selections, disposable caches and executable audit jobs. Imported evidence is retained
        without restoring source access or permitting old apply receipts.
      required:
        - artifacts
        - task_artifacts
        - audit_runs
        - audit_findings
        - audit_evidence
      properties:
        artifacts:
          type: array
          items:
            $ref: "#/components/schemas/PortableGithubArtifact"
          maxItems: 50000
        task_artifacts:
          type: array
          items:
            $ref: "#/components/schemas/PortableTaskArtifact"
          maxItems: 100000
        audit_runs:
          type: array
          items:
            $ref: "#/components/schemas/PortableAuditRun"
          maxItems: 10000
        audit_findings:
          type: array
          items:
            $ref: "#/components/schemas/PortableAuditFinding"
          maxItems: 100000
        audit_evidence:
          type: array
          items:
            $ref: "#/components/schemas/GithubAuditEvidence"
          maxItems: 10000
      additionalProperties: false
