components:
  schemas:
    GithubAuditCorrectionInput:
      type: object
      required: [finding_id]
      properties:
        finding_id:
          $ref: "#/components/schemas/Identifier"
        resolution:
          type: string
          maxLength: 30
          description: Required fixed for bug_resolve. Other resolutions require an explicit manual bug action.
        reason:
          type: string
          maxLength: 10000
          description: Required nonblank reason for bug_reopen; forbidden for ordinary corrections.
        confirmation_token:
          type: string
          maxLength: 4096
          description: Exact actor-bound token returned by an eligible preview. Required to mutate; never persist in client telemetry.
      additionalProperties: false
    GithubAuditCorrectionRequest:
      type: object
      required: [assessment_version, preview, items]
      properties:
        assessment_version:
          type: integer
          enum: [2]
        preview:
          type: boolean
        items:
          type: array
          minItems: 1
          maxItems: 200
          description: Unique finding IDs, in deterministic response order. Each item binds its own policy inputs and proof.
          items:
            $ref: "#/components/schemas/GithubAuditCorrectionInput"
      additionalProperties: false
    GithubAuditCorrectionTaskSnapshot:
      type: object
      description: Committed lifecycle result at receipt time. Fetch the normal task endpoint for other card details or newer changes.
      required: [id, key, project_id, kind, column_id, version, position, completed_at, claimed_by, claim_expires_at]
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        key:
          type: string
        project_id:
          $ref: "#/components/schemas/Identifier"
        kind:
          $ref: "#/components/schemas/TaskKind"
        column_id:
          $ref: "#/components/schemas/Identifier"
        version:
          type: integer
          format: int64
        position:
          type: number
        completed_at:
          $ref: "#/components/schemas/NullableTimestamp"
        claimed_by:
          type: [string, "null"]
        claim_expires_at:
          $ref: "#/components/schemas/NullableTimestamp"
        bug:
          $ref: "#/components/schemas/BugDetails"
      additionalProperties: false
    GithubAuditCorrectionResult:
      type: object
      required: [audit_id, actor_id, finding_id, outcome, outcome_known, message]
      properties:
        audit_id:
          $ref: "#/components/schemas/Identifier"
        actor_id:
          $ref: "#/components/schemas/Identifier"
          description: Original applying actor for an already_applied receipt.
        finding_id:
          $ref: "#/components/schemas/Identifier"
        task_id:
          $ref: "#/components/schemas/Identifier"
        outcome:
          type: string
          enum: [eligible, applied, already_applied, skipped, failed]
        outcome_known:
          type: boolean
          description: False means the server could not establish an outcome; retry the identical request/key. A transport timeout is also unknown.
        message:
          type: string
        action:
          type: string
          enum: [complete, reopen, start, block, move, bug_resolve, bug_reopen]
        source_column_id:
          $ref: "#/components/schemas/Identifier"
        target_column_id:
          $ref: "#/components/schemas/Identifier"
        target_semantic_state:
          $ref: "#/components/schemas/SemanticState"
        captured_version:
          type: integer
          format: int64
        fingerprint:
          type: string
          description: Exact assessment, source, actor, policy inputs and captured/current local context hash. This hash alone never authorizes apply.
        required_inputs:
          type: array
          items:
            type: string
            enum: [resolution, reason]
        confirmation_token:
          type: string
          description: Eligible previews only; valid for five minutes in this server process.
        expires_at:
          $ref: "#/components/schemas/Timestamp"
        request_key:
          type: string
        baselines:
          type: array
          items:
            $ref: "#/components/schemas/GithubAuditRepository"
        task:
          $ref: "#/components/schemas/GithubAuditCorrectionTaskSnapshot"
      additionalProperties: false
    GithubAuditCorrectionResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/GithubAuditCorrectionResult"
      additionalProperties: false
