components:
  schemas:
    GithubAuditTask:
      type: object
      required:
        - id
        - key
        - title
        - description
        - version
        - column_id
        - criteria
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        key:
          type: string
        title:
          type: string
        description:
          type: string
        version:
          type: integer
          minimum: 1
        column_id:
          $ref: "#/components/schemas/Identifier"
        semantic_state:
          type: string
          description: Captured board placement; optional for older imported evidence.
        column_name:
          type: string
        criteria:
          type: array
          items:
            type: string
        kind:
          type: string
        checklist_policy:
          type: string
        conditions:
          type: array
          items:
            $ref: "#/components/schemas/GithubAuditCondition"
        context:
          $ref: "#/components/schemas/GithubAuditContext"
      additionalProperties: false
    GithubAuditRepository:
      type: object
      required:
        - repository
        - ref
        - sha
        - repository_id
      properties:
        repository:
          type: string
        ref:
          type: string
        sha:
          type: string
          pattern: ^[a-fA-F0-9]{40}$
        repository_id:
          type: integer
          minimum: 1
        pull_request:
          type: integer
          minimum: 1
      additionalProperties: false
    GithubAuditItem:
      type: object
      required:
        - id
        - kind
        - title
        - url
        - repository
        - sha
        - text
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        kind:
          type: string
          enum:
            - file
            - pull_request
            - check
            - task_context
        title:
          type: string
        url:
          type: string
        repository:
          type: string
        sha:
          type: string
        blob_sha:
          type: string
        path:
          type: string
        start_line:
          type: integer
          minimum: 1
        end_line:
          type: integer
          minimum: 1
        text:
          type: string
        task_ids:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Identifier"
          description: Captured tasks associated with this PR or check evidence.
        ref:
          type: string
        source_role:
          type: string
          enum:
            - baseline
            - linked_pr
            - task_context
        evidence_class:
          type: string
          enum:
            - implementation
            - test_source
            - documentation
            - other
            - pull_request
            - observed_check
            - task_fact
        criterion_ids:
          type: array
          items:
            type: string
      additionalProperties: false
      allOf:
        - if:
            properties:
              kind:
                enum:
                  - file
                  - pull_request
                  - check
          then:
            properties:
              sha:
                type: string
                pattern: ^[a-fA-F0-9]{40}$
    GithubAuditEvidence:
      type: object
      description: Immutable commit-pinned evidence and captured task identity. Current source access is
        checked before private contents are returned.
      required:
        - audit_id
        - captured_at
        - partial
        - omissions
        - repositories
        - items
        - tasks
      properties:
        audit_id:
          $ref: "#/components/schemas/Identifier"
        captured_at:
          $ref: "#/components/schemas/Timestamp"
        partial:
          type: boolean
        omitted_files:
          type: integer
          minimum: 0
        omissions:
          type: array
          items:
            type: string
        repositories:
          type: array
          items:
            $ref: "#/components/schemas/GithubAuditRepository"
        items:
          type: array
          items:
            $ref: "#/components/schemas/GithubAuditItem"
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/GithubAuditTask"
        assessment_version:
          type: integer
          const: 2
        columns:
          type: array
          items:
            $ref: "#/components/schemas/Column"
        source_coverage:
          type: array
          items:
            $ref: "#/components/schemas/GithubAuditSourceCoverage"
        retrieval_budget:
          $ref: "#/components/schemas/GithubAuditRetrievalBudget"
        criterion_gaps:
          type: array
          items:
            $ref: "#/components/schemas/GithubAuditCriterionGap"
        criterion_coverage:
          type: array
          items:
            $ref: "#/components/schemas/GithubAuditCriterionCoverage"
      additionalProperties: false
