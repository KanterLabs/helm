components:
  schemas:
    Watch:
      type: object
      required:
        - id
        - actor_id
        - project_id
        - created_at
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        actor_id:
          $ref: "#/components/schemas/Identifier"
        project_id:
          $ref: "#/components/schemas/Identifier"
        task_id:
          oneOf:
            - $ref: "#/components/schemas/Identifier"
            - type: "null"
        created_at:
          $ref: "#/components/schemas/Timestamp"
      additionalProperties: false
    WatchCreateRequest:
      oneOf:
        - type: object
          required:
            - project_id
          properties:
            project_id:
              $ref: "#/components/schemas/Identifier"
          additionalProperties: false
        - type: object
          required:
            - task_id
          properties:
            task_id:
              $ref: "#/components/schemas/Identifier"
          additionalProperties: false
    Notification:
      type: object
      required:
        - id
        - recipient_id
        - event_type
        - title
        - body
        - payload
        - dedupe_key
        - created_at
        - updated_at
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        recipient_id:
          $ref: "#/components/schemas/Identifier"
        actor_id:
          $ref: "#/components/schemas/Identifier"
        event_type:
          type: string
          minLength: 1
        type:
          type: string
          description: Compatibility alias for event_type.
        project_id:
          $ref: "#/components/schemas/Identifier"
        task_id:
          $ref: "#/components/schemas/Identifier"
        title:
          type: string
        body:
          type: string
        payload:
          type: object
          additionalProperties: true
        dedupe_key:
          type: string
          minLength: 1
        read_at:
          $ref: "#/components/schemas/NullableTimestamp"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
      additionalProperties: false
    NotificationMutationSummary:
      type: object
      required:
        - id
        - read_at
      description: Read-state mutation acknowledgement for bearer tokens without notifications:read or
        tasks:read. Read-scoped tokens and humans receive the full notification.
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        read_at:
          $ref: "#/components/schemas/NullableTimestamp"
      additionalProperties: false
    NotificationReadBulkRequest:
      type: object
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 200
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Identifier"
        all:
          const: true
      additionalProperties: false
      description: Provide ids or all=true; the server rejects an empty request.
    NotificationPreferences:
      type: object
      required:
        - actor_id
        - assignments
        - mentions
        - blockers
        - state_changes
        - updated_at
      properties:
        actor_id:
          $ref: "#/components/schemas/Identifier"
        assignments:
          type: boolean
        mentions:
          type: boolean
        blockers:
          type: boolean
        state_changes:
          type: boolean
        updated_at:
          $ref: "#/components/schemas/Timestamp"
      additionalProperties: false
    NotificationPreferencesPatch:
      type: object
      minProperties: 1
      properties:
        assignments:
          type: boolean
        mentions:
          type: boolean
        blockers:
          type: boolean
        state_changes:
          type: boolean
      additionalProperties: false
    NotificationCollection:
      type: object
      required:
        - data
        - next_cursor
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        next_cursor:
          type: string
          description: Empty string when there is no next page.
      additionalProperties: false
    WatchCollection:
      type: object
      required:
        - data
        - next_cursor
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Watch"
        next_cursor:
          type: string
          description: Empty string when there is no next page.
      additionalProperties: false
