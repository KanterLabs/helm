components:
  schemas:
    Agent:
      type: object
      required:
        - id
        - kind
        - name
        - admin
        - created_at
        - updated_at
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        kind:
          const: agent
        name:
          type: string
          minLength: 1
          maxLength: 200
        admin:
          type: boolean
          const: false
        disabled_at:
          $ref: "#/components/schemas/Timestamp"
        project_ids:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Identifier"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
        description:
          type: string
          maxLength: 10000
        tokens:
          type: array
          items:
            $ref: "#/components/schemas/Token"
      additionalProperties: false
    AgentCreateRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 10000
        project_ids:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Identifier"
          description: Non-empty project access ceiling for this agent; empty means any project.
      additionalProperties: false
    Token:
      type: object
      required:
        - id
        - agent_id
        - actor_id
        - name
        - scopes
        - project_ids
        - created_at
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        agent_id:
          $ref: "#/components/schemas/Identifier"
        actor_id:
          $ref: "#/components/schemas/Identifier"
        name:
          type: string
          minLength: 1
          maxLength: 200
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Scope"
        project_ids:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Identifier"
        expires_at:
          $ref: "#/components/schemas/NullableTimestamp"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        last_used_at:
          $ref: "#/components/schemas/NullableTimestamp"
    TokenCreateRequest:
      type: object
      required:
        - name
        - scopes
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Scope"
        project_ids:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Identifier"
          description: Optional project restriction for this token.
        expires_at:
          $ref: "#/components/schemas/NullableTimestamp"
      additionalProperties: false
    TokenCreated:
      allOf:
        - $ref: "#/components/schemas/Token"
        - type: object
          required:
            - token
          properties:
            token:
              type: string
              minLength: 1
              description: Plaintext bearer token. Returned only once.
    AgentCollection:
      type: object
      required:
        - data
        - next_cursor
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Agent"
        next_cursor:
          type: string
          description: Empty string when there is no next page.
      additionalProperties: false
