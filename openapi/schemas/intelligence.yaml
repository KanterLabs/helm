components:
  schemas:
    LunaRun:
      type: object
      required:
        - id
        - feature
        - outcome
        - model
        - effort
        - steps
        - started_at
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        project_id:
          $ref: "#/components/schemas/Identifier"
        project_key:
          type: string
          maxLength: 80
        feature:
          type: string
          enum:
            - task_draft
            - project_intelligence
        outcome:
          type: string
          enum:
            - running
            - succeeded
            - invalid_output
            - incomplete
            - limit_reached
            - timed_out
            - canceled
            - unavailable
        model:
          type: string
          minLength: 1
          maxLength: 120
        effort:
          type: string
          enum:
            - low
            - medium
            - high
            - xhigh
            - max
            - ultra
        thread_id:
          type: string
          maxLength: 200
        turn_id:
          type: string
          maxLength: 200
        duration_ms:
          type: integer
          minimum: 0
          maximum: 300000
        output_bytes:
          type: integer
          minimum: 0
          maximum: 2097152
        detail:
          type: string
          maxLength: 500
        steps:
          type: array
          maxItems: 32
          description: Content-free execution milestones in sequence order. Older runs have an empty array.
          items:
            $ref: "#/components/schemas/LunaRunStep"
        started_at:
          $ref: "#/components/schemas/Timestamp"
        completed_at:
          $ref: "#/components/schemas/Timestamp"
      additionalProperties: false
    LunaRunStep:
      type: object
      required:
        - sequence
        - kind
        - at
      properties:
        sequence:
          type: integer
          minimum: 1
          maximum: 32
        kind:
          type: string
          enum:
            - thread_started
            - turn_started
            - response_generated
            - validation
            - outcome
        at:
          $ref: "#/components/schemas/Timestamp"
      additionalProperties: false
    LunaRunDetail:
      type: object
      required:
        - id
        - feature
        - outcome
        - model
        - effort
        - steps
        - started_at
        - content_available
        - input_truncated
        - output_truncated
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        project_id:
          $ref: "#/components/schemas/Identifier"
        project_key:
          type: string
          maxLength: 80
        feature:
          type: string
          enum:
            - task_draft
            - project_intelligence
        outcome:
          type: string
          enum:
            - running
            - succeeded
            - invalid_output
            - incomplete
            - limit_reached
            - timed_out
            - canceled
            - unavailable
        model:
          type: string
          minLength: 1
          maxLength: 120
        effort:
          type: string
          enum:
            - low
            - medium
            - high
            - xhigh
            - max
            - ultra
        thread_id:
          type: string
          maxLength: 200
        turn_id:
          type: string
          maxLength: 200
        duration_ms:
          type: integer
          minimum: 0
          maximum: 300000
        output_bytes:
          type: integer
          minimum: 0
          maximum: 2097152
        detail:
          type: string
          maxLength: 500
        steps:
          type: array
          maxItems: 32
          items:
            $ref: "#/components/schemas/LunaRunStep"
        started_at:
          $ref: "#/components/schemas/Timestamp"
        completed_at:
          $ref: "#/components/schemas/Timestamp"
        content_available:
          type: boolean
        input_text:
          type: string
          description: Model input when content was saved
          bounded to 64 KiB of UTF-8.: null
        output_text:
          type: string
          description: Model output
          including partial output on failures: null
          bounded to 2 MiB of UTF-8.: null
        input_truncated:
          type: boolean
        output_truncated:
          type: boolean
      additionalProperties: false
    ProjectIntelligenceMetrics:
      type: object
      required:
        - open_tasks
        - completed_tasks
        - active_tasks
        - blocked_tasks
        - overdue_tasks
        - due_soon_tasks
        - urgent_tasks
        - high_priority_tasks
        - action_needed
        - stale_agent_work
        - dependency_blocked
        - direct_unblock_count
        - severe_bugs
        - unread_notifications
        - created_7d
        - completed_7d
        - net_open_change_7d
        - planned_focus_count
        - focus_due_soon
      properties:
        open_tasks:
          type: integer
          minimum: 0
        completed_tasks:
          type: integer
          minimum: 0
        active_tasks:
          type: integer
          minimum: 0
        blocked_tasks:
          type: integer
          minimum: 0
        overdue_tasks:
          type: integer
          minimum: 0
        due_soon_tasks:
          type: integer
          minimum: 0
        urgent_tasks:
          type: integer
          minimum: 0
        high_priority_tasks:
          type: integer
          minimum: 0
        action_needed:
          type: integer
          minimum: 0
        stale_agent_work:
          type: integer
          minimum: 0
        dependency_blocked:
          type: integer
          minimum: 0
        direct_unblock_count:
          type: integer
          minimum: 0
        severe_bugs:
          type: integer
          minimum: 0
        unread_notifications:
          type: integer
          minimum: 0
        created_7d:
          type: integer
          minimum: 0
        completed_7d:
          type: integer
          minimum: 0
        net_open_change_7d:
          type: integer
        planned_focus_count:
          type: integer
          minimum: 0
        focus_due_soon:
          type: integer
          minimum: 0
        oldest_active_days:
          type: number
          minimum: 0
        last_activity_at:
          type: string
          format: date-time
      additionalProperties: false
    ProjectIntelligenceRecommendation:
      type: object
      required:
        - project_id
        - attention
        - reason_codes
        - summary
        - confidence
        - metrics
      properties:
        project_id:
          type: string
          minLength: 1
          maxLength: 128
        attention:
          type: string
          enum:
            - act_now
            - watch
            - steady
            - quiet
        reason_codes:
          type: array
          maxItems: 3
          uniqueItems: true
          items:
            type: string
            enum:
              - action_needed
              - overdue
              - focus_due_soon
              - severe_bugs
              - dependency_blocked
              - unblock_leverage
              - blocked_work
              - due_soon
              - urgent_work
              - high_priority
              - active_work
              - inbox_attention
              - growing_backlog
              - quiet
        summary:
          type: string
          minLength: 1
          maxLength: 240
        confidence:
          type: string
          enum:
            - high
            - medium
            - low
        metrics:
          $ref: "#/components/schemas/ProjectIntelligenceMetrics"
      additionalProperties: false
    ProjectIntelligenceInsight:
      type: object
      required:
        - kind
        - project_ids
        - summary
      properties:
        kind:
          type: string
          enum:
            - attention_queue
            - unblock_leverage
            - delivery_risk
            - stall_detection
            - flow_anomaly
            - agent_attention
            - planning_hygiene
            - quiet_project_review
        project_ids:
          type: array
          minItems: 1
          maxItems: 6
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 128
        summary:
          type: string
          minLength: 1
          maxLength: 300
      additionalProperties: false
    ProjectIntelligenceResponse:
      type: object
      required:
        - as_of
        - source
        - stale
        - snapshot_hash
        - recommendation_version
        - projects
        - workspace_insights
      properties:
        as_of:
          type: string
          format: date-time
        source:
          type: string
          enum:
            - deterministic
            - luna
        stale:
          type: boolean
        snapshot_hash:
          type: string
          pattern: ^[0-9a-f]{64}$
        recommendation_version:
          type: string
          minLength: 1
          maxLength: 100
        projects:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/ProjectIntelligenceRecommendation"
        workspace_insights:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/ProjectIntelligenceInsight"
      additionalProperties: false
    LunaRunCollection:
      type: object
      required:
        - data
        - next_cursor
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/LunaRun"
        next_cursor:
          type: string
          description: Empty because this bounded debugging view returns only the requested latest runs.
      additionalProperties: false
