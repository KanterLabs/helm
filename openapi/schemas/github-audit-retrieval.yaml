components:
  schemas:
    GithubAuditCondition:
      type: object
      properties:
        id: &a1
          type: string
        text: *a1
        origin:
          type: string
          enum:
            - goal
            - acceptance_criterion
            - checklist
        source_id: *a1
        task_version:
          type: integer
          minimum: 1
        line:
          type: integer
          minimum: 1
        end_line:
          type: integer
          minimum: 1
        completed:
          type: boolean
      required:
        - id
        - text
        - origin
        - task_version
      additionalProperties: false
    GithubAuditDependency:
      type: object
      properties:
        task_id:
          $ref: "#/components/schemas/Identifier"
        version: &a2
          type: integer
        semantic_state: *a1
      required:
        - task_id
        - version
        - semantic_state
      additionalProperties: false
    GithubAuditContext:
      type: object
      properties:
        claimed_by: *a1
        claim_expires_at:
          $ref: "#/components/schemas/Timestamp"
        dependencies:
          type: array
          items:
            $ref: "#/components/schemas/GithubAuditDependency"
        unstarted:
          type: boolean
        readiness:
          type: string
          enum:
            - ready
            - not_ready
        blocker: *a1
      required:
        - dependencies
        - unstarted
      additionalProperties: false
      description: "Captured context, not implementation proof. Affirmative declarations currently use
        Work status: unstarted, Readiness: ready/not_ready, and Blocker: reason. Unknown
        declarations remain absent; unmet dependencies supply concrete blocker facts."
    GithubAuditCriterionGap:
      type: object
      properties:
        task_id: *a1
        criterion_id: *a1
        repository: *a1
        ref: *a1
        sha: *a1
        source_role: *a1
        path: *a1
        code: *a1
        message: *a1
      required:
        - task_id
        - source_role
        - code
        - message
      additionalProperties: false
    GithubAuditCriterionCoverage:
      type: object
      properties:
        task_id: *a1
        criterion_id: *a1
        repository: *a1
        sha: *a1
        source_role: *a1
        evidence_ids:
          type:
            - array
            - "null"
          items: *a1
        inspected_paths:
          type:
            - array
            - "null"
          items: *a1
      required:
        - task_id
        - criterion_id
        - repository
        - sha
        - source_role
        - evidence_ids
        - inspected_paths
      additionalProperties: false
    GithubAuditSourceCoverage:
      type: object
      properties:
        repository: *a1
        ref: *a1
        sha: *a1
        source_role: *a1
        indexed_files: *a2
        inspected_files: *a2
        unread_files: *a2
        index_partial:
          type: boolean
      required:
        - repository
        - ref
        - sha
        - source_role
        - indexed_files
        - inspected_files
        - unread_files
        - index_partial
      additionalProperties: false
    GithubAuditRetrievalBudget:
      type: object
      properties:
        per_card_files:
          type: integer
          minimum: 0
        per_card_bytes:
          type: integer
          minimum: 0
        run_files:
          type: integer
          minimum: 0
        run_read_bytes:
          type: integer
          minimum: 0
        run_excerpt_bytes:
          type: integer
          minimum: 0
        run_discovery_requests:
          type: integer
          minimum: 0
        per_card_discovery_requests:
          type: integer
          minimum: 0
        refinement_rounds:
          type: integer
          minimum: 0
        excerpt_bytes:
          type: integer
          minimum: 0
        duration_seconds:
          type: integer
          minimum: 0
        index_planning_rounds:
          type: integer
          minimum: 0
          maximum: 1
      required:
        - per_card_files
        - per_card_bytes
        - run_files
        - run_read_bytes
        - run_excerpt_bytes
        - run_discovery_requests
        - per_card_discovery_requests
        - refinement_rounds
        - excerpt_bytes
        - duration_seconds
      additionalProperties: false
      description: Server-owned shared limits for literal retrieval and semantic path planning. File
        refinement <=2 rounds per criterion, plus <=1 directory-index routing round for large trees.
        Per-card discovery <=4, run discovery <=48, duration <=90 seconds. No model tools, arbitrary
        URLs or repository execution.
