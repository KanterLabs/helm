components:
  responses:
    GithubConnectionConflict:
      description: |
        The GitHub connection is in the wrong state for this request. The
        stable `error.code` is one of `github_operator_managed` (a token file
        is configured), `github_signin_unavailable` (no GitHub App client ID,
        GitHub disabled, or Helm shutting down), `github_already_connected`,
        `github_not_connected` or `github_reconnect_required`.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
        X-Roadmap-Revision:
          $ref: "#/components/headers/XRoadmapRevision"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: github_operator_managed
              message: An operator manages GitHub on this Helm with a token file.
              details: {}
    GithubDependencyFailed:
      description: |
        GitHub could not be reached (`github_unreachable`) or refused the
        request (`github_refused`). Never 502 or 504, whose bodies a proxy in
        front of Helm may replace. The message is Helm's own; GitHub's text is
        never included.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
        X-Roadmap-Revision:
          $ref: "#/components/headers/XRoadmapRevision"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: github_unreachable
              message: Helm could not reach GitHub.
              details: {}
