paths:
  /api/v1/public-endpoints:
    get:
      operationId: getPublicEndpoints
      summary: Show the public webhook endpoint
      description: |
        Human administrators only. A public endpoint exposes only Helm's
        webhook routes (`exposed_paths`) on a Cloudflare-proxied hostname
        through a Cloudflare Tunnel, so self-hosted installs need no open
        ports, DNS server or certificates. While one is active, new ticket
        webhook URLs use its hostname.
      tags:
        - Tickets
      responses:
        "200":
          description: Active endpoint, connector status and history
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            X-Roadmap-Revision:
              $ref: "#/components/headers/XRoadmapRevision"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicEndpointView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createPublicEndpoint
      summary: Create a Cloudflare public webhook endpoint
      description: |
        Human administrators only. Uses the supplied Cloudflare API token once
        to create a remotely managed tunnel whose ingress routes only webhook
        paths to Helm's loopback hooks listener, plus a proxied CNAME for the
        hostname, then starts `cloudflared`. The API token is never stored or
        returned; the tunnel run token is kept in an owner-only file beside
        the database. Required token permissions are listed in
        `required_permissions`. Any failure removes what was created.
      tags:
        - Tickets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicEndpointCreateRequest"
            example:
              provider: cloudflare
              hostname: hooks.example.com
              api_token: <cloudflare api token>
      responses:
        "201":
          description: Endpoint provisioned and connector starting
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            X-Roadmap-Revision:
              $ref: "#/components/headers/XRoadmapRevision"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicEndpointView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/public-endpoints/{endpoint}:
    parameters:
      - name: endpoint
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Identifier"
    delete:
      operationId: disablePublicEndpoint
      summary: Disable a public webhook endpoint
      description: |
        Human administrators only. Stops `cloudflared` and deletes the local
        tunnel token immediately. With an `api_token` body it also deletes the
        DNS record and tunnel in Cloudflare; without one the endpoint is marked
        `cleanup_pending` and the response explains what to remove.
      tags:
        - Tickets
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                api_token:
                  type: string
              additionalProperties: false
      responses:
        "200":
          description: Disabled
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            X-Roadmap-Revision:
              $ref: "#/components/headers/XRoadmapRevision"
          content:
            application/json:
              schema:
                type: object
                required:
                  - endpoint
                properties:
                  endpoint:
                    $ref: "#/components/schemas/PublicEndpoint"
                  warning:
                    type: string
                additionalProperties: false
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
