paths:
  /api/v1/tasks/{task}/pull-requests:
    parameters:
    - $ref: '#/components/parameters/TaskPath'
    get:
      operationId: listTaskPullRequests
      summary: List saved pull request links
      tags:
      - Tasks
      security:
      - cookieAuth: []
      - cloudflareAccess: []
      - bearerAuth:
        - tasks:read
      responses:
        '200':
          description: List saved pull request links
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PullRequestLinkCollection'
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '404': &id004
          $ref: '#/components/responses/NotFound'
        '409': &id005
          $ref: '#/components/responses/TaskMutationConflict'
        '428': &id006
          $ref: '#/components/responses/PreconditionRequired'
        '429': &id007
          $ref: '#/components/responses/TooManyRequests'
        '500': &id008
          $ref: '#/components/responses/InternalServerError'
        '503': &id009
          $ref: '#/components/responses/ServiceUnavailable'
      description: Local URL links only. No credentials, repository selection, remote verification, checks
        or status lookups. Existing saved GitHub PR links are returned without historical metadata. Project
        access is enforced.
    post:
      operationId: linkTaskPullRequest
      summary: Link a pull request URL
      tags:
      - Tasks
      security:
      - cookieAuth: []
      - cloudflareAccess: []
      - bearerAuth:
        - tasks:write
      responses:
        '201':
          description: Link a pull request URL
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PullRequestLinkMutation'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '428': *id006
        '429': *id007
        '500': *id008
        '503': *id009
      description: Link an HTTPS GitHub /owner/repo/pull/N or Gitea/Forgejo /owner/repo/pulls/N URL without
        contacting the host. Normalize duplicate URL variants; an existing link returns the same identity
        without advancing the task version. Task claims and the current If-Match version are enforced.
        Gitea hosts remain distinct. At most 100 links per task.
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PullRequestLinkRequest'
  /api/v1/tasks/{task}/pull-requests/{link}:
    parameters:
    - $ref: '#/components/parameters/TaskPath'
    - name: link
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    delete:
      operationId: unlinkTaskPullRequest
      summary: Remove a saved pull request link
      tags:
      - Tasks
      security:
      - cookieAuth: []
      - cloudflareAccess: []
      - bearerAuth:
        - tasks:write
      responses:
        '200':
          description: Remove a saved pull request link
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PullRequestUnlinkMutation'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '428': *id006
        '429': *id007
        '500': *id008
        '503': *id009
      description: Remove only this task relationship. Other tasks linking the same PR retain their link.
        Task claims and the exact current If-Match version are enforced.
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
