paths:
  /api/v1/audits/{audit}/job:
    parameters:
      - $ref: "#/components/parameters/AuditPath"
    get:
      operationId: getGithubAuditJob
      summary: Read server audit progress
      description: Requires tasks:read and project access. Returns durable measured stage, outcome and
        counts. External-agent runs have no server job and return 404.
      tags:
        - GitHub
        - Audits
      externalDocs:
        description: GitHub beta API guide
        url: docs/GITHUB_BETA_API.md
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GithubAuditJob"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/audits/{audit}/cancel:
    parameters:
      - $ref: "#/components/parameters/AuditPath"
    post:
      operationId: cancelGithubAudit
      summary: Cancel a server audit
      description: Requires the originating signed-in human or project-authorized human administrator.
        Fences the attempt before interrupting work. Repeating cancellation keeps the terminal job.
        Existing external-agent runs remain separate.
      tags:
        - GitHub
        - Audits
      security:
        - cookieAuth: []
        - cloudflareAccess: []
      externalDocs:
        description: GitHub beta API guide
        url: docs/GITHUB_BETA_API.md
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GithubAuditJob"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/audits/{audit}/retry:
    parameters:
      - $ref: "#/components/parameters/AuditPath"
    post:
      operationId: retryGithubAudit
      summary: Retry with a fresh audit run
      description: Requires a signed-in human with project access and their own connected AI account. The
        previous job must be terminal. Creates a new run linked by retry_of; captures scope again
        under current repository and account authorization.
      tags:
        - GitHub
        - Audits
      security:
        - cookieAuth: []
        - cloudflareAccess: []
      externalDocs:
        description: GitHub beta API guide
        url: docs/GITHUB_BETA_API.md
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Required non-whitespace key, at most 200 characters. The originating actor/project and
            identical scope/retry source reuse the existing durable run. A different request under
            the same key conflicts. This is durable run identity, not a cached private evidence
            response.
          schema:
            type: string
            minLength: 1
            maxLength: 200
            pattern: .*\S.*
      responses:
        "202":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GithubAuditStartResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
