paths:
  /api/v1/projects:
    get:
      operationId: listProjects
      summary: List projects
      tags:
        - Projects
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: archived
          in: query
          description: Include archived projects; defaults to false.
          required: false
          schema:
            type: boolean
            default: false
        - name: favorite
          in: query
          description: Restrict results to favorite projects.
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Cursor-paginated projects
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            X-Roadmap-Revision:
              $ref: "#/components/headers/XRoadmapRevision"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectCollection"
              examples:
                projects:
                  $ref: "#/components/examples/ProjectCollectionExample"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      operationId: createProject
      summary: Create a project
      tags:
        - Projects
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreateRequest"
            example:
              key: OPS
              slug: operations
              name: Operations
              description: Work for the operations team.
              color: "#2563EB"
              favorite: true
      responses:
        "201":
          description: |
            Project created with the five default semantic columns. Humans and
            bearer tokens with projects:read receive the full project; a
            projects:write-only bearer receives only its id.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            X-Roadmap-Revision:
              $ref: "#/components/headers/XRoadmapRevision"
            Location:
              $ref: "#/components/headers/Location"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMutationResponse"
              examples:
                project:
                  $ref: "#/components/examples/ProjectExample"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/projects/{project}:
    parameters:
      - $ref: "#/components/parameters/ProjectPath"
    get:
      operationId: getProject
      summary: Get a project
      tags:
        - Projects
      responses:
        "200":
          description: Project
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            X-Roadmap-Revision:
              $ref: "#/components/headers/XRoadmapRevision"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
              examples:
                project:
                  $ref: "#/components/examples/ProjectExample"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    patch:
      operationId: updateProject
      summary: Update a project
      description: |
        An empty object or a body with no recognized project field returns 400.
        Non-nullable properties reject explicit JSON `null`; string properties
        enforce their declared length and format constraints.
        Project keys and slugs remain stable unless explicitly changed in the
        request. Archive/restore preserves both identifiers. Send the
        optional If-Match header with the last observed ETag to make an admin
        edit conflict-safe; stale guarded edits return 409.
      tags:
        - Projects
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ProjectColumnIfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectPatchRequest"
            example:
              name: Platform Operations
              favorite: true
      responses:
        "200":
          description: |
            Updated project. Humans and bearer tokens with projects:read
            receive the full project; a projects:write-only bearer receives
            only its id.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            X-Roadmap-Revision:
              $ref: "#/components/headers/XRoadmapRevision"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMutationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
