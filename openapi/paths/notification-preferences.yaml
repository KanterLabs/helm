paths:
  /api/v1/notification-preferences:
    get:
      operationId: getNotificationPreferences
      summary: Read notification preferences
      tags:
        - Notifications
      responses:
        "200":
          description: Current category preferences
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            X-Roadmap-Revision:
              $ref: "#/components/headers/XRoadmapRevision"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreferences"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
    patch:
      operationId: updateNotificationPreferences
      summary: Update notification preferences
      description: Partial update of assignment, mention, blocker, and state-change categories.
      tags:
        - Notifications
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationPreferencesPatch"
      responses:
        "200":
          description: Updated preferences
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            X-Roadmap-Revision:
              $ref: "#/components/headers/XRoadmapRevision"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreferences"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
