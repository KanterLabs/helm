paths:
  /api/v1/projects/{project}/labels:
    parameters:
      - $ref: "#/components/parameters/ProjectPath"
    get:
      operationId: listLabels
      summary: List project labels
      tags:
        - Labels
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Cursor-paginated labels
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            X-Roadmap-Revision:
              $ref: "#/components/headers/XRoadmapRevision"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabelCollection"
              example:
                data:
                  - id: label_api
                    project_id: proj_ops
                    name: api
                    color: "#2563EB"
                    created_at: 2026-08-27T09:00:00Z
                    updated_at: 2026-08-27T09:00:00Z
                next_cursor: ""
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      operationId: createLabel
      summary: Create a project label
      tags:
        - Labels
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LabelCreateRequest"
            example:
              name: api
              color: "#2563EB"
      responses:
        "201":
          description: Label created
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            X-Roadmap-Revision:
              $ref: "#/components/headers/XRoadmapRevision"
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Label"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
