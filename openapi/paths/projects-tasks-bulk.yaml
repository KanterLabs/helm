paths:
  /api/v1/projects/{project}/tasks/bulk:
    parameters:
      - $ref: "#/components/parameters/ProjectPath"
    post:
      operationId: bulkMutateProjectTasks
      summary: Apply bounded guarded task mutations
      description: |
        Apply one operation to at most 100 project-local task references. Each
        item carries its own positive task version, so a mixed batch remains
        safe when another writer changes one task while the request is in
        flight. Supported operations are `move`, `assign`, `priority`,
        `labels`, `due_at`, `complete`, and `block`. `partial` mode commits
        each item independently and returns `applied`, `skipped`, or
        `conflict` for every item. `atomic` mode commits all items in one
        transaction; any conflict or invalid runtime precondition rolls back
        every item and marks the failed item as `conflict` or `skipped` while
        the other items report `skipped` with `atomic_rollback`.
        Project access, active claims, dependency/lifecycle guards, and stale
        versions are checked inside the same guarded task transactions as the
        corresponding single-task mutations. Every committed item emits its
        normal task activity event. Supplying an Idempotency-Key makes the
        complete bounded response safe to replay.
      tags:
        - Tasks
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkTaskMutationRequest"
            example:
              mode: partial
              mutations:
                - task: OPS-41
                  version: 7
                  operation: priority
                  priority: urgent
                - task: OPS-42
                  version: 3
                  operation: move
                  destination_column_id: col_ready
                  expected_source_column_id: col_backlog
                  source: bulk_triage
      responses:
        "200":
          description: Bounded per-task mutation outcomes. Runtime conflicts are represented in the item
            results rather than changing the HTTP status.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            X-Roadmap-Revision:
              $ref: "#/components/headers/XRoadmapRevision"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkTaskMutationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
