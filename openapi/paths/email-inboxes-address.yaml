paths:
  /api/v1/email-inboxes/{inbox}/address:
    parameters:
      - name: inbox
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Identifier"
    post:
      operationId: replaceEmailInboxAddress
      summary: Replace an email inbox's address
      description: Human administrators only. Issues a new address; the previous one bounces immediately.
      tags:
        - Tickets
      responses:
        "200":
          description: Inbox with its new address
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            X-Roadmap-Revision:
              $ref: "#/components/headers/XRoadmapRevision"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailInbox"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
