paths:
  /api/v1/integrations/github:
    get:
      operationId: getGithubIntegration
      summary: Get GitHub connection diagnostics
      description: Human administrators receive sanitized configuration and connection state. No token or
        private source content is returned.
      tags:
        - GitHub
      security:
        - cookieAuth: []
        - cloudflareAccess: []
      externalDocs:
        description: GitHub beta API guide
        url: docs/GITHUB_BETA_API.md
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GithubDiagnostics"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/integrations/github/check:
    post:
      operationId: checkGithubIntegration
      summary: Test the GitHub connection
      description: Human administrators test endpoint permissions against the configured allowlist.
        Provider failures are represented in the diagnostic state.
      tags:
        - GitHub
      security:
        - cookieAuth: []
        - cloudflareAccess: []
      externalDocs:
        description: GitHub beta API guide
        url: docs/GITHUB_BETA_API.md
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GithubDiagnostics"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalServerError"
