paths:
  /api/v1/projects/{project}/import:
    parameters:
      - $ref: "#/components/parameters/ProjectPath"
    post:
      operationId: importPortableArchiveIntoProject
      summary: Validate or import an archive into this project
      description: Imports a one-project archive into the selected project without replacing existing
        records; use `dry_run` for a validation report.
      tags:
        - Projects
      parameters:
        - name: dry_run
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: conflict
          in: query
          required: false
          schema:
            type: string
            enum:
              - remap
              - fail
            default: remap
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortableArchiveRequestBody"
      responses:
        "200":
          description: Validation or import report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortableImportReport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
