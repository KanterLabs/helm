paths:
  /api/v1/ticket-webhooks/{webhook}/test:
    parameters:
      - name: webhook
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Identifier"
    post:
      operationId: sendTestTicket
      summary: Send a test ticket through the public URL
      description: |
        Human administrators only, with an active public endpoint. Helm POSTs
        a low-priority generic ticket (`dedupe_key: helm-public-url-test`) to
        `https://{hostname}/api/v1/hooks/tickets/probe/{nonce}`; the nonce is
        one-time, expires in 30 seconds and is bound to this webhook, so the
        hooks listener files the ticket under it with the code real
        deliveries use. Success proves an outside app can open tickets
        through Cloudflare and the tunnel. A failed round trip is still HTTP
        200 with `ok: false` and a `message` explaining the likely cause.
      tags:
        - Tickets
      responses:
        "200":
          description: Test completed
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            X-Roadmap-Revision:
              $ref: "#/components/headers/XRoadmapRevision"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketTestResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
