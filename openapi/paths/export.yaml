paths:
  /api/v1/export:
    get:
      operationId: exportPortableArchive
      summary: Export a versioned portable archive
      description: >-
        Exports live projects, columns, tasks, labels, comments, relationships,

        and activity references as a `helm.portable` v2 JSON archive. A

        v2 archive includes project-local releases and explicit task release

        references; v1 archives remain import-compatible and treat every task

        as unassigned.

        `project` query selects one project; an unscoped caller may omit it to

        export every accessible project. This is a portability snapshot, not

        a database backup or restore operation.
         Export defaults to version 2. Request version=3 to include retained GitHub PR relationships and audit history; source credentials, repository selections, disposable caches and executable audit jobs are excluded. Requires projects:read, tasks:read and events:read. Source access is revalidated before private retained evidence is exported.
      tags:
        - Projects
      parameters:
        - name: project
          in: query
          required: false
          description: Project ID, key, or stable slug to export.
          schema:
            $ref: "#/components/schemas/Identifier"
        - name: version
          in: query
          required: false
          description: Portable envelope version. Omit for existing v2 compatibility; explicitly select 3 for
            durable GitHub/audit history.
          schema:
            type: integer
            enum:
              - 2
              - 3
            default: 2
      responses:
        "200":
          description: Portable archive JSON attachment
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            X-Roadmap-Revision:
              $ref: "#/components/headers/XRoadmapRevision"
            X-Helm-Portable-Format:
              description: Portable envelope format identifier.
              schema:
                type: string
                example: helm.portable
            X-Helm-Portable-Version:
              description: Selected portable envelope version.
              schema:
                type: integer
                enum:
                  - 2
                  - 3
                example: 2
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortableArchive"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
