paths:
  /api/v1/projects/{project}/watch:
    parameters:
      - $ref: "#/components/parameters/ProjectPath"
    get:
      operationId: getProjectWatch
      summary: List the current actor's watches for a project
      tags:
        - Notifications
      responses:
        "200":
          description: Project watches
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            X-Roadmap-Revision:
              $ref: "#/components/headers/XRoadmapRevision"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchCollection"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: watchProject
      summary: Follow a project
      tags:
        - Notifications
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: Project watch created
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            X-Roadmap-Revision:
              $ref: "#/components/headers/XRoadmapRevision"
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Watch"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
