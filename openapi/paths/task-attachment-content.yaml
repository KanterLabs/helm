paths:
  /api/v1/tasks/{task}/attachments/{attachment}/content:
    parameters:
      - $ref: '#/components/parameters/TaskPath'
      - name: attachment
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Identifier'
    get:
      operationId: getTaskAttachmentContent
      summary: Read original task image
      tags:
        - Tasks
      security:
        - cookieAuth: []
        - cloudflareAccess: []
        - bearerAuth:
            - tasks:read
      description: 'Authenticated private content. Project and staged-image access is checked before serving
        bytes. Cache-Control: no-store and X-Content-Type-Options: nosniff. Supports conditional and range
        requests.'
      responses:
        '200':
          description: Image bytes
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    head:
      operationId: headTaskAttachmentContent
      summary: 'Read headers: Read original task image'
      tags:
        - Tasks
      security:
        - cookieAuth: []
        - cloudflareAccess: []
        - bearerAuth:
            - tasks:read
      description: 'Authenticated private content. Project and staged-image access is checked before serving
        bytes. Cache-Control: no-store and X-Content-Type-Options: nosniff. Supports conditional and range
        requests.'
      responses:
        '200':
          description: Image bytes
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
