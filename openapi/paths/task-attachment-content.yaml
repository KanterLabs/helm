        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    head:
      operationId: headTaskAttachmentThumbnail
      summary: 'Read headers: Read PNG thumbnail'
