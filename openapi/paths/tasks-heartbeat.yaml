paths:
  /api/v1/tasks/{task}/heartbeat:
    parameters:
      - $ref: "#/components/parameters/TaskPath"
    post:
      operationId: heartbeatTaskAgentWork
      summary: Refresh an agent work heartbeat
      description: |
        Refresh only the `updated_at` liveness timestamp of the existing
        agent-work snapshot identified by `operation_id`. The caller must
        have `tasks:claim`, be allowed to access the task's project, own the
        task's active unexpired claim, and match both the snapshot actor and
        operation ID. The task must remain unfinished. Heartbeats are quiet
        and inherently idempotent: they do not change the task version or
        `tasks.updated_at`, replace any snapshot content, append comments or
        events or persist idempotency
        records. `If-Match` is intentionally not required because the
        heartbeat never changes task state or its optimistic-concurrency
        version. `Idempotency-Key` is not supported; omit it.
      tags:
        - Tasks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentWorkHeartbeatRequest"
            example:
              operation_id: codex/ops-release
      responses:
        "200":
          description: |
            Task with the unchanged version and refreshed agent-work
            timestamp. Humans and bearer tokens with `tasks:read` receive the
            full task; bearer tokens without `tasks:read` receive only
            `{id,version}` according to the normal mutation redaction. The
            strong task ETag is unchanged.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            X-Roadmap-Revision:
              $ref: "#/components/headers/XRoadmapRevision"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskMutationResponse"
              examples:
                full:
                  $ref: "#/components/examples/TaskHeartbeatExample"
                reduced:
                  $ref: "#/components/examples/TaskMutationSummaryExample"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
