paths:
  /api/v1/tasks/{task}/restore:
    parameters:
      - $ref: "#/components/parameters/TaskPath"
    post:
      operationId: restoreTask
      summary: Restore a soft-deleted task
      description: |
        Restores a task deleted by the soft-delete endpoint. Restore requires
        the exact deleted task version in `If-Match` and an `Idempotency-Key`.
        A restore is accepted only while the task remains deleted; a stale or
        already-restored task returns a conflict. Retained claims are cleared
        so Undo never revives an expired or unknown lease.
      tags:
        - Tasks
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Restored task with its current version
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            X-Roadmap-Revision:
              $ref: "#/components/headers/XRoadmapRevision"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskMutationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/TaskMutationConflict"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
