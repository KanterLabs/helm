paths:
  /api/v1/projects/{project}/timeline:
    parameters:
      - $ref: "#/components/parameters/ProjectPath"
    get:
      operationId: listProjectTimeline
      summary: List unified project activity
      description: |
        Return the durable newest-first activity stream for every non-deleted
        task in the selected project, merging structured agent progress,
        comments, and task-change events. The response uses stable opaque
        keyset cursors: pass `next_cursor` as `before` to load older activity.
        Generated progress comments and their `comment.created` events are
        represented once by the corresponding `agent_progress` item. Legacy
        comments and events remain available as comments or generic
        `task_change` items without inferred progress fields. Timeline reads
        require `tasks:read` and honor the caller's project access ceiling.
      tags:
        - Projects
      parameters:
        - $ref: "#/components/parameters/BeforeTimelineCursor"
        - $ref: "#/components/parameters/TimelineKind"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Newest-first unified project activity page
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            X-Roadmap-Revision:
              $ref: "#/components/headers/XRoadmapRevision"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskTimelineCollection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
