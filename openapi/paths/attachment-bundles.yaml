paths:
  /api/v1/import/bundle:
    post:
      operationId: importPortableBundle
      summary: Validate or import an image-bearing portable bundle
      description: Accept a raw application/zip helm.portable.bundle v5 archive. Validate checksums, images
        and links before transactional insertion. dry_run validates without mutation. Uses the same options
        and import report as JSON import. Thumbnails are regenerated; credentials and running jobs are
        not restored.
      tags:
        - Projects
      parameters:
        - name: dry_run
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: conflict
          in: query
          required: false
          schema:
            type: string
            enum:
              - remap
              - fail
            default: remap
        - name: target_project
          in: query
          required: false
          description: Existing project ID, key, or slug to receive the imported archive.
          schema:
            $ref: '#/components/schemas/Identifier'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/zip:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Validation or import report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortableImportReport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
