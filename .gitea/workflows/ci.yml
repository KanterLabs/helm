name: Helm shadow CI

# Shadow of .github/workflows/ci.yml on ActionRunners (Helm card H3, task
# AR-43). GitHub stays authoritative until cutover; this pipeline only
# reports. It is secret-free: no secrets, variables, environments, registry
# login or deploy step. Each job runs as root in a disposable node:24-bookworm
# container on a VM that reaches only Gitea and the public internet, with no
# Docker daemon and no persistent cache.
#
# `container` follows once the Helm runner template with contained Docker
# exists (plan D3). `beta_deploy` and `deploy` are never ported (plan D6).
# Contract: docs/GITEA_CI_SHADOW_FAILURES.md. Guide: docs/GITEA_CI_SHADOW.md.
# Policy: deploy/test-gitea-ci-policy.py, run inside `checks` on both CIs.

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: helm-shadow-${{ gitea.workflow }}-${{ gitea.ref }}
  cancel-in-progress: ${{ gitea.ref != 'refs/heads/main' && gitea.ref != 'refs/heads/beta' }}

# Go must not download a different toolchain behind the version check.
env:
  GOTOOLCHAIN: local

jobs:
  checks:
    runs-on: ar-helm-canary-short
    timeout-minutes: 40
    steps:
      - name: Check out the commit
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No cache inputs: job VMs keep nothing between jobs.
      - name: Set up Go
        uses: https://github.com/actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
        # setup-go takes go.mod's toolchain line only when GOTOOLCHAIN is not
        # "local"; with "local" it installs the older `go` directive instead.
        env:
          GOTOOLCHAIN: auto
      - name: Set up Node.js
        uses: https://github.com/actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
      - name: Verify the toolchain and install Compose
        run: bash .gitea/scripts/prepare-runner.sh checks
      - name: Frontend checks and build
        working-directory: web
        run: |
          npm ci
          npm audit --audit-level=high
          npm run openapi:check
          npm run check
          npm run build
      # Same commands as GitHub's checks job, except that Compose is the
      # standalone binary because the runner has no Docker CLI.
      - name: Embed frontend and run Go checks
        run: |
          rm -rf -- internal/webassets/dist internal/frontend/dist
          install -d internal/webassets/dist internal/frontend/dist dist
          cp -a web/dist/. internal/webassets/dist/
          cp -a web/dist/. internal/frontend/dist/
          test -z "$(gofmt -l cmd internal)"
          GOSUMDB=sum.golang.org go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.10
          go vet ./...
          GOSUMDB=sum.golang.org go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
          python3 -m py_compile deploy/coolify-deploy.py
          bash -n deploy/*.sh deploy/helm-deploy-gateway
          ./deploy/test-deployment-security.sh
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o dist/helm ./cmd/helm
          docker-compose config >/dev/null
      - name: Upload immutable binary artifact
        uses: https://github.com/ChristopherHX/gitea-upload-artifact@9493ce5e9eb6241749e2914efc413aa831a3dc44
        with:
          name: helm-binary-${{ gitea.sha }}
          path: dist/helm
          if-no-files-found: error
          retention-days: ${{ gitea.event_name == 'pull_request' && 3 || 14 }}

  browser:
    runs-on: ar-helm-canary-heavy
    timeout-minutes: 40
    steps:
      - name: Check out the commit
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: https://github.com/actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
        # setup-go takes go.mod's toolchain line only when GOTOOLCHAIN is not
        # "local"; with "local" it installs the older `go` directive instead.
        env:
          GOTOOLCHAIN: auto
      - name: Set up Node.js
        uses: https://github.com/actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
      - name: Verify the toolchain and install Chromium
        run: bash .gitea/scripts/prepare-runner.sh browser
      # The shared composite runs the suites; its v7 artifact upload is
      # unproven on Gitea, so this job uploads the same paths itself.
      - name: Run race-instrumented browser validation
        uses: ./.github/actions/browser-validation
        with:
          evidence-name: helm-e2e-${{ gitea.sha }}
          upload-evidence: 'false'
      - name: Upload browser and resource evidence
        if: always()
        uses: https://github.com/ChristopherHX/gitea-upload-artifact@9493ce5e9eb6241749e2914efc413aa831a3dc44
        with:
          name: helm-e2e-${{ gitea.sha }}
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/helm-e2e-evidence
            ${{ runner.temp }}/helm-runner-metrics
          if-no-files-found: error
          retention-days: ${{ job.status == 'failure' && 7 || 3 }}

  # Mirrors GitHub's protected `race` context: it passes only when the
  # race-instrumented browser job succeeded.
  race:
    if: ${{ always() }}
    needs: browser
    runs-on: ar-helm-canary-short
    timeout-minutes: 40
    steps:
      - name: Require successful race-instrumented workflows
        env:
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: test "$BROWSER_RESULT" = success
