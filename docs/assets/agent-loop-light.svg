<svg xmlns="http://www.w3.org/2000/svg" width="900" height="150" viewBox="0 0 900 150" role="img" aria-labelledby="t">
<title id="t">Agent work loop: discover, claim, pulse progress, finish</title>
<style>
.dash{stroke-dasharray:6 8;animation:flow 1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-14}}
.glow{opacity:0;animation:lit 6s linear infinite}
@keyframes lit{0%,4%{opacity:0}8%,22%{opacity:.9}30%,100%{opacity:0}}
.token{animation:tok 6s cubic-bezier(.65,0,.35,1) infinite}
@keyframes tok{0%,8%{transform:translateX(0)}25%,33%{transform:translateX(212px)}50%,58%{transform:translateX(424px)}75%,92%{transform:translateX(636px)}100%{transform:translateX(636px);opacity:0}}
@media (prefers-reduced-motion:reduce){.dash,.glow,.token{animation:none}}
</style>
<rect width="900" height="150" rx="16" fill="#f7f8fb"/><rect x=".5" y=".5" width="899" height="149" rx="16" fill="none" stroke="#e5e8ef"/>
<path class="dash" d="M132 62H768" stroke="#6d5efc" stroke-width="2" fill="none" opacity=".6"/>
<circle class="glow" style="animation-delay:0.0s" cx="132" cy="62" r="28" fill="none" stroke="#2ea879" stroke-width="3"/><g><circle cx="132" cy="62" r="22" fill="#ffffff" stroke="#6d5efc" stroke-width="2"/><text x="132" y="67" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14px;font-weight:700" fill="#6d5efc">1</text><text x="132" y="108" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14px;font-weight:600" fill="#1d2433">Discover</text><text x="132" y="128" text-anchor="middle" style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px" fill="#626b7d">GET /issues</text></g>
<circle class="glow" style="animation-delay:1.5s" cx="344" cy="62" r="28" fill="none" stroke="#2ea879" stroke-width="3"/><g><circle cx="344" cy="62" r="22" fill="#ffffff" stroke="#6d5efc" stroke-width="2"/><text x="344" y="67" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14px;font-weight:700" fill="#6d5efc">2</text><text x="344" y="108" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14px;font-weight:600" fill="#1d2433">Claim</text><text x="344" y="128" text-anchor="middle" style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px" fill="#626b7d">POST …/claim</text></g>
<circle class="glow" style="animation-delay:3.0s" cx="556" cy="62" r="28" fill="none" stroke="#2ea879" stroke-width="3"/><g><circle cx="556" cy="62" r="22" fill="#ffffff" stroke="#6d5efc" stroke-width="2"/><text x="556" y="67" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14px;font-weight:700" fill="#6d5efc">3</text><text x="556" y="108" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14px;font-weight:600" fill="#1d2433">Pulse</text><text x="556" y="128" text-anchor="middle" style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px" fill="#626b7d">POST …/progress</text></g>
<circle class="glow" style="animation-delay:4.5s" cx="768" cy="62" r="28" fill="none" stroke="#2ea879" stroke-width="3"/><g><circle cx="768" cy="62" r="22" fill="#ffffff" stroke="#6d5efc" stroke-width="2"/><text x="768" y="67" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14px;font-weight:700" fill="#6d5efc">4</text><text x="768" y="108" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14px;font-weight:600" fill="#1d2433">Finish</text><text x="768" y="128" text-anchor="middle" style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px" fill="#626b7d">POST …/complete</text></g>
<g class="token"><circle cx="132" cy="62" r="0" fill="#2ea879"/></g>
</svg>